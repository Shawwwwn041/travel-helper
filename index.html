<body>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap">
<style>
/* Layout: 與「貓咪照顧小幫手」同一套設計語言——白底標題區＋淺灰色帶，白色卡片不加框不加陰影，細線分隔，藍色只用在可以按的東西 */
:root{
  color-scheme:light;
  --bg:#ffffff;
  --band:#f5f5f7;
  --ink:#1d1d1f;
  --muted:#6e6e73;
  --faint:#a1a1a6;
  --line:#d2d2d7;
  --hair:#e8e8ed;
  --soft:#f5f5f7;
  /* 不用藍色：強調色改成深灰，文字按鈕用墨色，淺底用灰色玻璃 */
  --blue:#48484a;
  --link:#1d1d1f;
  --blue-soft:rgba(120,120,128,.12);
  --sage:#4f8a74;--sage-soft:#dfeee8;
  --bad:#a85a4a;--bad-soft:#f9e0dd;
  --font:"Noto Serif TC","Source Han Serif TC","Noto Serif CJK TC","PMingLiU",serif;
  --ease:cubic-bezier(.28,.11,.32,1);
  --spring:cubic-bezier(.34,1.36,.64,1);
  --col:640px;
}
/* 刻意只用白底黑字的淺色主題，和貓咪照顧小幫手一致 */
*{box-sizing:border-box}
[hidden]{display:none !important}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid rgba(72,72,74,.4);outline-offset:2px;border-radius:10px}
:focus:not(:focus-visible){outline:none}
.li .tx:focus-visible{outline:none;background:rgba(120,120,128,.08);border-radius:8px}
.num{font-variant-numeric:tabular-nums lining-nums}
.ico{display:inline-grid;place-items:center;flex:none}
.ico svg{display:block}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:var(--col);margin:0 auto}
.band{background:var(--band);padding-block:32px calc(120px + env(safe-area-inset-bottom,0px))}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.screen{display:flex;flex-direction:column;min-height:100vh;animation:fadeIn .35s var(--ease)}
.screen > .band{flex:1}

/* ===== 登入 ===== */
.login{min-height:100vh;display:grid;align-content:center;justify-items:center;text-align:center;padding-block:64px 48px}
.logo{display:block;width:176px;height:auto;margin:0 auto 24px;overflow:visible;animation:rise .7s var(--ease) both}
.logo .lp{animation:float 3.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
.about{display:grid;justify-items:center;gap:2px;margin:32px 0 4px;color:var(--muted);font-size:.75rem;text-align:center}
.about .logo{width:84px;margin:0 0 8px;animation:none}
.about b{color:var(--ink);font-size:.875rem;font-weight:600}
.login h1{font-size:2rem;font-weight:600;letter-spacing:-.015em;line-height:1.1;margin:0;animation:rise .7s var(--ease) both}
.login .lede{margin:24px 0 0;font-size:1.25rem;line-height:1.8;animation:rise .7s .08s var(--ease) both}
.login .lede span{display:block}
.g-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:48px;height:50px;padding:0 32px;border:0;border-radius:980px;background:var(--ink);color:#fff;font-size:1rem;font-weight:500;letter-spacing:.02em;cursor:pointer;transition:transform .2s var(--ease),background .2s;animation:rise .7s .16s var(--ease) both}
@media (hover:hover){.g-btn:hover{background:#000}}
.g-btn:active{transform:scale(.96)}
.login .alt{margin-top:8px;height:44px;padding:0 12px;border:0;background:transparent;color:var(--muted);font-size:1rem;cursor:pointer;transition:opacity .2s;animation:rise .7s .19s var(--ease) both}
.login .alt:active{opacity:.5}
@media (hover:hover){.login .alt:hover{color:var(--ink)}}
.login small{display:block;margin-top:8px;color:var(--muted);font-size:0.875rem;animation:rise .7s .22s var(--ease) both}

/* ===== 頂部 ===== */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px}
.back{display:inline-flex;align-items:center;gap:2px;height:44px;margin-left:-8px;padding:0 8px 0 2px;border:0;border-radius:10px;background:transparent;color:var(--link);font-size:1rem;cursor:pointer;transition:opacity .2s}
.back:active{opacity:.5}
.text-btn{height:44px;padding:0 2px;border:0;background:transparent;color:var(--link);font-size:1rem;cursor:pointer;transition:opacity .2s}
.text-btn:active{opacity:.5}
/* 選單列（按下去進到下一頁） */
.line.go{width:100%;border-left:0;border-right:0;border-bottom:0;background:transparent;text-align:left;cursor:pointer;transition:background .2s}
.line.go:first-child{border-top:0}
.line.go:active{background:var(--soft)}
.line.go .val{flex:1;min-width:0;text-align:right;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line.go .chev{color:var(--faint);transform:rotate(180deg)}
.line.go:disabled{cursor:default}
.line.go:disabled .val{color:var(--muted)}
/* 第二層頁面：從右邊滑進來（iOS 的導覽方式） */
.subpage{position:fixed;left:50%;bottom:0;z-index:43;display:flex;flex-direction:column;width:min(100%,var(--col));height:min(86vh,calc(100vh - 28px - env(safe-area-inset-top,0px)));background:var(--band);border-radius:16px 16px 0 0;transform:translate(calc(-50% + 100vw),0);transition:transform .45s cubic-bezier(.22,1,.36,1);box-shadow:-10px 0 30px rgba(0,0,0,.06)}
.subpage.on{transform:translate(-50%,0)}
.subpage .sheet-h{position:static;margin:0;padding:0 max(16px,env(safe-area-inset-left,0px));border-radius:16px 16px 0 0}
.subpage .back{margin-left:-8px;justify-self:start}
.search{position:relative;margin:2px max(16px,env(safe-area-inset-left,0px)) 8px}
.search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:38px;padding:0 12px 0 32px;border:0;border-radius:10px;background:rgba(120,120,128,.12);font-size:16px;color:var(--ink)}
.search input:focus{outline:none}
.search input::placeholder{color:var(--muted)}
.sub-list{flex:1;overflow:auto;overscroll-behavior:contain;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sub-list .grp-lab{margin:16px 16px -16px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 16px;border:0;border-top:1px solid var(--hair);background:transparent;text-align:left;cursor:pointer;transition:background .2s}
.opt:first-child{border-top:0}
.opt:active{background:var(--soft)}
.opt .nm{flex:1;min-width:0}
.opt .cd{color:var(--muted);font-size:.875rem;letter-spacing:.04em}
.opt .ck{width:20px;color:var(--blue);opacity:0;transition:opacity .2s}
.opt[aria-selected="true"] .ck{opacity:1}
.opt[aria-selected="true"] .nm{font-weight:600}
.no-hit{padding:32px 0;text-align:center;color:var(--muted)}
.me-btn{position:relative;display:grid;place-items:center;flex:none;width:36px;height:36px;min-width:0;padding:0;margin:0;border:0;overflow:hidden;aspect-ratio:1;-webkit-appearance:none;appearance:none;border-radius:50%;background:var(--soft);color:var(--ink);font-weight:600;font-size:1rem;cursor:pointer;transition:transform .2s var(--ease),background .2s}
.me-btn:active{transform:scale(.92)}
.me-btn img{position:absolute;inset:0;width:100%;height:100%;max-width:none;border-radius:50%;object-fit:cover;object-position:center;display:block}
.offline{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 8px;border-radius:980px;background:var(--soft);color:var(--muted);font-size:.75rem}
.offline::before{content:"";width:6px;height:6px;border-radius:50%;background:#c98a68}
button.offline{border:0;cursor:pointer;transition:transform .2s var(--ease)}
button.offline:active{transform:scale(.96)}
.head{padding-block:8px 32px}
.head h1{font-size:2rem;font-weight:600;letter-spacing:-.012em;line-height:1.15;margin:0;text-wrap:balance;animation:rise .6s var(--ease) both}
.head p{margin:8px 0 0;color:var(--muted);font-size:1rem;animation:rise .6s .06s var(--ease) both}

/* ===== 卡片與列 ===== */
.card{background:#fff;border-radius:18px;padding:8px 24px;min-width:0}
.stack{display:grid;gap:16px}
/* 首頁：依狀態分成「準備中／旅途中／已結束」三區，用分割線隔開；寬螢幕並排成三欄 */
.phases{display:grid;gap:32px}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 4px 16px;font-size:1rem;font-weight:600;color:var(--ink);animation:rise .6s var(--ease) both}
.sec-h .n{color:var(--muted);font-weight:400;font-size:1rem}
.sec-h::after{content:"";flex:1;height:1px;background:#d2d2d7;margin-left:4px}
.sec-none{margin:0 4px;color:var(--faint);font-size:1rem;animation:rise .6s var(--ease) both}
@media (min-width:960px){
  .home .col{max-width:1100px}
  .phases{grid-template-columns:repeat(3,minmax(0,1fr));gap:48px}
  .phases > section{position:relative}
  .phases > section + section::before{content:"";position:absolute;left:-24px;top:0;bottom:0;width:1px;background:#d2d2d7}
  .sec-h::after{display:none}
}
.rise{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:0.875rem;white-space:nowrap;line-height:1.6}
.pill.before{background:var(--sage-soft);color:var(--sage)}
.pill.during{background:var(--blue-soft);color:var(--link)}
.pill.after{background:var(--soft);color:var(--muted)}
.link-btn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0;border:0;background:transparent;color:var(--muted);font-size:1rem;cursor:pointer;transition:opacity .2s}
.link-btn:active{opacity:.5}
@media (hover:hover){.link-btn:hover{color:var(--ink)}}
/* 新增旅程：虛線空白卡（像「這裡還可以再放一趟」） */
.add-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;min-height:96px;padding:16px;border:1.5px dashed #c7c7cc;border-radius:18px;background:transparent;color:var(--muted);font-size:1rem;cursor:pointer;transition:border-color .25s,color .25s,background .25s,transform .2s var(--ease)}
.add-card .t{display:inline-flex;align-items:center;gap:8px}
.add-card small{color:var(--faint);font-size:0.875rem}
.add-card.big{min-height:168px}
.add-card.big .t{font-size:1rem;color:var(--ink)}
@media (hover:hover){.add-card:hover{border-color:#8e8e93;color:var(--ink);background:rgba(255,255,255,.55)}}
.add-card:active{transform:scale(.98);background:rgba(255,255,255,.7)}
.foot-note{margin:32px 4px 0;color:var(--muted);font-size:0.875rem;line-height:1.7}

/* 旅程卡 */
.trip{display:block;width:100%;padding:0 24px;border:0;border-radius:18px;background:#fff;text-align:left;cursor:pointer;transition:transform .45s var(--spring),box-shadow .35s var(--ease)}
@media (hover:hover){.trip:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.10),0 2px 8px rgba(0,0,0,.05)}}
.trip:active{transform:scale(.985)}
.trip-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:24px 0 16px}
.trip-top b{display:block;font-size:1.25rem;font-weight:600;line-height:1.35}
.trip-top span.d{display:block;margin-top:2px;color:var(--muted);font-size:.875rem}
.trip-top .pill{margin-top:2px}
.trip-foot{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 0 16px;border-top:1px solid var(--hair);color:var(--muted);font-size:.875rem}
.trip-foot b{color:var(--ink);font-size:1rem;font-weight:600}

/* 長按旅程卡：浮起＋選單（同貓咪網站的長按） */
.trip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.trip.pressing{transform:scale(.97);transition-duration:.38s}
.trip.held{transform:scale(1.02);box-shadow:0 18px 44px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06);position:relative;z-index:46}
.ctx-scrim{position:fixed;inset:0;z-index:45;background:rgba(245,245,247,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .25s var(--ease)}
.ctx-scrim.on{opacity:1}
.ctx{position:fixed;z-index:47;min-width:230px;padding:8px;border-radius:16px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 12px 40px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.06),inset 0 0 0 .5px rgba(0,0,0,.08);transform-origin:top left;animation:ctxIn .26s var(--spring)}
.ctx.up{transform-origin:bottom left}
.ctx.out{animation:ctxOut .16s var(--ease) forwards}
@keyframes ctxIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes ctxOut{to{opacity:0;transform:scale(.96)}}
.ctx button{display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--ink);font-size:1rem;text-align:left;cursor:pointer;transition:background .15s}
.ctx button:hover,.ctx button:focus-visible{background:var(--soft);outline:none}
.ctx button .ico{color:var(--muted)}
.ctx .sep{height:1px;margin:4px 8px;background:var(--hair)}
.ctx button.danger,.ctx button.danger .ico{color:var(--bad)}
.ctx button.armed{background:var(--bad-soft);font-weight:600}
.trip.renaming{cursor:default}
.trip.renaming input{width:100%;height:40px;margin:-4px 0 0;padding:0 8px;border:1px solid #8e8e93;border-radius:10px;background:#fff;font-size:1rem;font-weight:600;color:var(--ink);box-shadow:0 0 0 3px rgba(0,0,0,.06)}
.trip.renaming input:focus{outline:none}
/* 總覽裡的各帳戶剩餘 */
.split{margin-top:16px;border-top:1px solid var(--hair)}
.split button{display:block;width:100%;min-height:46px;padding:0;border:0;border-bottom:1px solid var(--hair);background:transparent;text-align:left;cursor:pointer;transition:opacity .2s}
.split button:last-child{border-bottom:0;margin-bottom:-8px}
.split button:active{opacity:.55}
.split .sp-top{display:flex;align-items:center;gap:12px}
.split .bar{height:5px;margin:8px 0 2px 32px}
.split .ico{color:var(--muted);width:22px}
.split .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split .n small{display:block;color:var(--muted);font-size:.75rem;line-height:1.3}
.split button{padding-block:8px 8px}
.split .v{text-align:right;font-weight:500}
.split .v small{display:block;color:var(--muted);font-size:.75rem;font-weight:400;line-height:1.3}
.split .neg{color:var(--bad)}

/* ===== 統計 ===== */
.st-top{padding:24px 24px}
.st-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.st-row .r{text-align:right}
.st-row .lab{display:block;color:var(--muted);font-size:0.875rem}
.st-row b{display:block;font-size:1rem;font-weight:600}
.st-row b.neg{color:var(--bad)}
.st-row .off{display:block;color:var(--muted);font-size:.875rem}
.orb{width:min(220px,62vw);margin:8px auto 4px}
.orb svg{display:block;width:100%;height:auto;filter:drop-shadow(0 14px 28px rgba(0,0,0,.10)) drop-shadow(0 2px 4px rgba(0,0,0,.06))}
.orb .lv{transform:translateY(200px);transition:transform 1.6s cubic-bezier(.22,1,.36,1)}
.orb.fill .lv{transform:translateY(var(--y))}
.orb .wv{animation:wave 5s linear infinite}
.orb .wv.b{fill:rgba(72,72,74,.2);animation-duration:7s;animation-direction:reverse}
.orb .wv.f{fill:rgba(72,72,74,.66)}
.orb.over .wv.f{fill:rgba(168,90,74,.7)}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-120px)}}
.orb .wv.b{animation-name:waveB}
@keyframes waveB{from{transform:translateX(0)}to{transform:translateX(-150px)}}
.orb .pc{font:600 34px var(--font);fill:var(--ink);text-anchor:middle;font-variant-numeric:tabular-nums}
.orb .pl{font:400 12px var(--font);fill:var(--muted);text-anchor:middle;letter-spacing:.1em}
.orb .in{fill:#fff}
.st-body{margin-top:16px;padding:16px 24px 16px}
.mini-wrap{display:flex;justify-content:center;margin-bottom:8px}
.mini-seg{position:relative;display:inline-flex;padding:3px;border-radius:980px;background:rgba(120,120,128,.14);box-shadow:inset 0 1px 2px rgba(0,0,0,.05);touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:background .25s}
.mini-seg .thumb{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:980px;pointer-events:none;background:linear-gradient(180deg,#fff,rgba(255,255,255,.88));box-shadow:0 3px 10px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08),inset 0 1px 0 #fff,inset 0 0 0 .5px rgba(0,0,0,.08)}
.mini-seg .thumb.ready{transition:translate .42s var(--ease),width .42s var(--ease),scale .3s var(--ease),box-shadow .3s var(--ease)}
/* 小滑塊也能按住左右拖（跟上方分頁列同一種手感） */
.mini-seg.drag{background:rgba(120,120,128,.18)}
.mini-seg.drag .thumb{transition:scale .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s var(--ease);scale:1.08;box-shadow:0 8px 20px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.10),inset 0 1px 0 #fff,inset 0 0 0 .5px rgba(0,0,0,.08)}
.mini-seg.drag button[aria-selected="true"]:not(.over){color:var(--muted);font-weight:400}
.mini-seg button.over{color:var(--ink);font-weight:600}
.mini-seg button{position:relative;z-index:1;height:30px;min-width:72px;padding:0 16px;border:0;border-radius:980px;background:transparent;color:var(--muted);font-size:.875rem;letter-spacing:.04em;cursor:pointer;transition:color .3s}
.mini-seg button[aria-selected="true"]{color:var(--ink);font-weight:600}
.st-pane.fade-in,.ls-pane.fade-in{animation:fadeIn .35s var(--ease)}
.crow{padding:12px 0 8px;border-bottom:1px solid var(--hair);animation:rise .45s var(--ease) both;animation-delay:calc(var(--i) * 40ms)}
.ctop{display:flex;align-items:center;gap:12px}
.ctop .ico{color:var(--muted);width:22px}
.ctop .cn{flex:1}
.ctop b{font-weight:600}

/* 旅程頁分頁：玻璃膠囊（同貓咪網站） */
.seg-nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:center;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:transparent;transition:box-shadow .3s,background-color .3s}
/* 毛玻璃只在捲動、黏在頂端時才開，平常不開（模糊邊緣會在寬螢幕上留下一條淡淡的框） */
.seg-nav.stuck{background:rgba(238,241,243,.82);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 1px 0 rgba(0,0,0,.06)}

.seg-nav .thumb{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:980px;pointer-events:none;background:linear-gradient(180deg,#fff,rgba(255,255,255,.88));box-shadow:0 4px 14px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.10),inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.04),inset 0 0 0 .5px rgba(0,0,0,.08)}
.seg-nav .thumb.ready{transition:translate .45s var(--ease),width .45s var(--ease),scale .3s var(--ease),box-shadow .3s var(--ease)}
/* 按住滑塊左右拖：滑塊微微放大、陰影加深，放開切到那一格（同貓咪網站） */

.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.28);opacity:0;transition:opacity .35s var(--ease)}

.sheet{position:fixed;left:50%;bottom:0;z-index:41;width:min(100%,var(--col));max-height:calc(100vh - 28px - env(safe-area-inset-top,0px));overflow:auto;overscroll-behavior:contain;transform:translate(-50%,104%);background:var(--band);border-radius:16px 16px 0 0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transition:transform .5s cubic-bezier(.22,1,.36,1)}

.menu-btn{display:block;width:100%;height:52px;padding:0 16px;border:0;border-top:1px solid var(--hair);background:transparent;text-align:left;font-size:1rem;color:var(--link);cursor:pointer}

.wide-btn{display:block;width:100%;height:50px;margin-top:24px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-size:1rem;font-weight:500;cursor:pointer;transition:transform .2s var(--ease),opacity .2s,background .2s}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:70;width:max-content;max-width:calc(100vw - 48px);padding:8px 24px;text-align:center;line-height:1.45;border-radius:980px;background:rgba(29,29,31,.92);color:#fff;font-size:1rem;transform:translate(-50%,8px);opacity:0;transition:opacity .25s,transform .35s var(--spring);pointer-events:none}

@media (max-width:360px){.card,.trip{padding-left:16px;padding-right:16px}.sum{padding:24px 16px}.sum .big{font-size:2rem}.amount{--fs:2.5rem}.cat .ico{width:38px;height:38px}.seg-nav button{min-width:64px;padding:0 16px}.line > label,.line > .k{width:4em}.line input,.line select{font-size:1rem}.line .bname{width:5em}}
/* ---- 清單 ---- */
.ls-top{padding:16px 24px 24px;text-align:left}

.ls-k{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

.pbar{height:6px;margin-top:12px;border-radius:3px;background:var(--hair);overflow:hidden}

.lcat{margin-top:24px;animation:rise .55s var(--ease) backwards}   /* 用 backwards：動畫結束就放掉圖層，拖到別的類別時才不會被蓋住 */
.lcat-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 8px 8px;font-size:1rem;font-weight:600}

.lgrp{background:#fff;border-radius:16px;padding:0 8px 0 16px}
.li{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 8px 8px 0;border-top:1px solid var(--hair);background:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.lgrp > .li:first-child{border-top:0}
.ck{flex:none;display:grid;place-items:center;width:38px;height:38px;margin:-8px -8px -8px -8px;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ck i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #c7c7cc;color:#fff;transition:background .25s,box-shadow .25s,transform .35s var(--spring)}
.ck i svg{opacity:0;transform:scale(.4);transition:opacity .2s,transform .35s var(--spring)}

.li .tx{flex:1;min-width:0;padding:4px 0;border:0;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}

.li .tx span{display:block;margin-top:1px;color:var(--muted);font-size:0.875rem;line-height:1.4;overflow-wrap:anywhere}
.li.done .tx b{color:var(--faint);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.2)}
.li .pic{flex:none;width:44px;height:44px;padding:0;border:0;border-radius:10px;background:var(--soft);overflow:hidden;cursor:zoom-in}

.li.add .plus{flex:none;display:grid;place-items:center;width:22px;color:var(--faint);transition:color .2s}

/* 長按拖動（沿用貓咪小幫手的做法） */
body.is-dragging,body.is-dragging *{cursor:grabbing !important;-webkit-user-select:none;user-select:none}
.li.pressing{scale:.985;transition:scale .38s var(--ease)}
.ced.dragging{position:relative;z-index:5;border-radius:12px;border-top-color:transparent;box-shadow:0 12px 32px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.06);scale:1.02;transition:scale .2s var(--ease),box-shadow .2s var(--ease)}

/* 清單項目拖動：拿起的項目浮在手指下，放開後會落的地方空出一格（可以跨類別） */

.li.lifted.settling{transition:top .22s var(--ease),left .22s var(--ease),scale .22s var(--ease),box-shadow .22s var(--ease);scale:1;box-shadow:0 0 0 rgba(0,0,0,0)}

/* 類別編輯 */

/* ---- 先選用法：兩張大卡片 ---- */

/* ---- 左滑刪除：往左滑出紅色「刪除」，再按一下才刪 ---- */

.sw-del{position:absolute;right:0;top:6px;bottom:6px;width:var(--sw,0px);display:grid;place-items:center;overflow:hidden;white-space:nowrap;border-radius:12px;background:var(--bad);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;visibility:hidden;-webkit-user-select:none;user-select:none}

/* ---- 登入後的歡迎動畫：一條線畫出地平線與雲，線條飛機從雲裡鑽出來帶出「歡迎」，再鑽進另一朵雲 ---- */
.hello{position:fixed;inset:0;z-index:60;display:grid;place-items:center;overflow:hidden;background:var(--bg);cursor:pointer;transition:opacity .7s var(--ease)}
.hello.out{opacity:0;pointer-events:none}
.hello-stage{position:relative;width:360px;height:300px;flex:none}
.hello svg.layer{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.hello-trail path{fill:none;stroke:#d2d2d7;stroke-width:1.2;stroke-linecap:round;transition:opacity .9s var(--ease)}
.hello-land .fill{fill:var(--bg)}
.hello-land .line{fill:none;stroke:#86868b;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.hello-word{position:absolute;inset:78px 0 auto;margin:0;text-align:center;font-size:40px;font-weight:600;letter-spacing:.08em;text-indent:.08em;line-height:1;color:var(--ink);-webkit-mask-image:linear-gradient(90deg,#000 -40px,transparent 0);mask-image:linear-gradient(90deg,#000 -40px,transparent 0)}
.hello-sub{position:absolute;inset:236px 0 auto;margin:0;text-align:center;color:var(--muted);font-size:16px;letter-spacing:.04em;opacity:0;transform:translateY(8px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.hello-sub.on{opacity:1;transform:none}
.hello-plane{position:absolute;left:0;top:0;width:38px;height:38px;offset-path:path("M 60 190 C 80 180 90 172 114 172 L 240 172 C 282 172 292 112 302 58");offset-rotate:auto;offset-anchor:center;offset-distance:0%}
.hello-plane svg{display:block;width:100%;height:100%;overflow:visible;fill:var(--bg);stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round}
.hello.calm .hello-word{-webkit-mask-image:none;mask-image:none;opacity:0;transition:opacity .8s var(--ease)}
.hello.calm .hello-word.on{opacity:1}
/* ===== 清透玻璃（像 iPhone Dock）：很透明、背後模糊、邊緣一道亮光、上方淡淡的光澤 ===== */
.back,.top .text-btn,.pill.during{position:relative}
.fab,.back,.top .text-btn,.pill.during{isolation:isolate;-webkit-backdrop-filter:blur(12px) saturate(190%) brightness(1.08);backdrop-filter:blur(12px) saturate(190%) brightness(1.08)}
.fab::before,.back::before,.top .text-btn::before,.pill.during::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;padding:1.2px;
  background:linear-gradient(160deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.3) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.fab::after,.back::after,.top .text-btn::after{content:"";position:absolute;inset:1px;z-index:-1;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 70% at 50% -10%,rgba(255,255,255,.55),rgba(255,255,255,0) 55%)}
.fab{background:rgba(255,255,255,.24);color:var(--ink);box-shadow:0 10px 28px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.06),inset 0 0 0 .5px rgba(0,0,0,.06)}

.top .text-btn{padding:0 16px}
.back:active,.top .text-btn:active{transform:scale(.95);opacity:1}
.pill.during{background:rgba(120,120,128,.12);color:var(--ink);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06)}
.sheet-h button:first-child{color:var(--muted)}
.sheet-h .done{font-weight:600}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}

/* ===== 主題 v2：低飽和同色系（霧白／霧藍／煙灰藍），8pt 間距 ===== */
:root{--bg:#eef1f3;--band:#eef1f3;--ink:#1e2327;--muted:#5b646b;--faint:#9aa4ab;--line:#e2e6ea;--hair:#e2e6ea;--soft:#eef1f3;
  --card:#fafbfc;--pri:#6e808a;--pri2:#8fa0a8;--pri3:#c3cdd3;--pri4:#d8dfe6;--acc:#c98a68;--blue:#6e808a;--link:#1e2327;--blue-soft:rgba(110,128,138,.12);--sage:#6e808a;--sage-soft:#e3e8ec}
body{background:var(--bg)}
.band{background:transparent}
.screen{position:relative;background:radial-gradient(80% 340px at 100% 0,rgba(216,223,230,.95),transparent 70%),linear-gradient(180deg,rgba(216,223,230,.35),transparent 420px)}
.card,.trip,.cv-card,.grp,.lgrp,.mode-card,.ced{background:var(--card)}

.grp-lab,.sh-done-lab{color:var(--muted);letter-spacing:.12em}
/* 主視覺卡：霧藍漸層＋柔光，一頁一張 */
.sh-sum,.st-top,.card.sum,.ls-top{position:relative;overflow:hidden;background:linear-gradient(140deg,#e2e8ec 0%,#d8dfe6 48%,#c9d3d9 100%) !important;box-shadow:0 0 0 1px rgba(143,160,168,.28),0 8px 24px rgba(110,128,138,.12) !important}
.sh-sum::after,.st-top::after,.card.sum::after,.ls-top::after{content:"";position:absolute;right:-48px;top:-72px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(250,251,252,.7),transparent 70%);pointer-events:none}
.sh-sum > *,.st-top > *,.card.sum > *,.ls-top > *{position:relative;z-index:1}
.sh-sum .pbar,.ls-top .pbar,.card.sum .bar{background:rgba(250,251,252,.7)}
/* 主色：進度、打勾、按鈕 */
.pbar i,.bar i{background:var(--pri)}

.tg-p{stroke:var(--pri)}.tg-d::after{box-shadow:inset 0 0 0 2px var(--pri);background:var(--card)}.tg-d.on::after{background:var(--pri)}

.phases{gap:32px}.sec-h{margin:0 4px 8px;font-size:0.875rem;font-weight:600;letter-spacing:.12em;color:var(--muted)}.sec-h::after{background:var(--line)}

/* ---- 首頁 v2：日期小字、每日一句、三種旅程卡 ---- */
.home .head .h-ey{margin:0 0 8px;font-size:.75rem;letter-spacing:.2em;color:var(--pri);animation:rise .6s var(--ease) both}

.lcat-h{display:flex;align-items:center}

  radial-gradient(46% 260px at 86% 360px,rgba(96,127,145,.55),transparent 72%),

  linear-gradient(180deg,rgba(216,223,230,.35),transparent 420px)}

  background:linear-gradient(150deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,.26) 55%,rgba(255,255,255,.14) 100%) !important;
  -webkit-backdrop-filter:blur(20px) saturate(170%) brightness(1.04);backdrop-filter:blur(20px) saturate(170%) brightness(1.04);

function el(tag, props, ...kids){
  const e = document.createElement(tag);
  if(props) for(const [k, v] of Object.entries(props)){
    if(v == null || v === false) continue;
    if(k === "class") e.className = v;
    else if(k === "text") e.textContent = v;          // 使用者輸入一律用 textContent，不當 HTML（防 XSS）
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if(k in e && k !== "list") e[k] = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => c != null && c !== false && e.append(c));
  return e;
}

    // 安全檢查：只接受合理的正數，而且跟內建值差不到 3 倍（防止來源被竄改或資料錯誤）
    if(!CUR[k] || k === "TWD" || typeof v !== "number" || !isFinite(v) || v <= 0) continue;
    if(v > BAKED[k] * 3 || v < BAKED[k] / 3) continue;
    CUR[k].rate = v; n++;
  }
  if(n){ RATES.date = date; RATES.live = !!live; }
  return n;
}
try{ const c = JSON.parse(localStorage.getItem(RATE_KEY)); if(c && c.date > RATES.date) applyRates(c.map, c.date, true); }catch(e){}
async function refreshRates(){
  if(RATES.live && RATES.date >= ymd(new Date(Date.now() - 864e5))) return;      // 已經是今天或昨天的就不再抓
  const urls = ["https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/twd.min.json",
                "https://latest.currency-api.pages.dev/v1/currencies/twd.min.json"];
  for(const u of urls){
    try{
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 6000);
      const res = await fetch(u, {signal:ctl.signal, cache:"no-cache"}); clearTimeout(tm);
      if(!res.ok) continue;
      const j = await res.json();
      if(!j || typeof j.date !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(j.date) || !j.twd) continue;
      const map = {};
      for(const k of Object.keys(CUR)){ const v = j.twd[k.toLowerCase()]; if(typeof v === "number" && v > 0) map[k] = 1 / v; }   // 來源是「1 台幣 = 多少外幣」，換成「1 外幣 = 多少台幣」
      if(applyRates(map, j.date, true)){
        try{ localStorage.setItem(RATE_KEY, JSON.stringify({date:j.date, map})); }catch(e){}
        if(!sheetOpen && !subPage) render();
        return;
      }
    }catch(e){}
  }
}

}

/* ================= 日期 ================= */
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dayDiff = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const WEEK = "日一二三四五六";
const md = s => { const d = parseYmd(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const mdw = s => `${md(s)}（${WEEK[parseYmd(s).getDay()]}）`;
const range = t => {
  const a = parseYmd(t.start), b = parseYmd(t.end), now = new Date().getFullYear();
  return `${a.getFullYear() !== now ? a.getFullYear() + "/" : ""}${md(t.start)} – ${a.getFullYear() !== b.getFullYear() ? b.getFullYear() + "/" : ""}${md(t.end)}`;
};
function phase(t){
  const today = ymd(new Date());
  if(today < t.start) return {key:"before", label:`還有 ${dayDiff(today, t.start)} 天`};
  if(today > t.end) return {key:"after", label:"已結束"};
  return {key:"during", label:`第 ${dayDiff(t.start, today) + 1} 天`};
}

function catColors(cats){
  const res = new Map(), used = new Set();
  for(const c of cats) if(PAL.includes(c.color)){ res.set(c.id, c.color); used.add(c.color); }
  for(const c of cats){
    if(res.has(c.id)) continue;

    if(!h || used.has(h)) h = PAL.find(x => !used.has(x)) || PAL[res.size % PAL.length];

  }

}

        const it = oldIt.get(d.id) || {id:d.id};
        Object.assign(it, raw);
        if(!raw.parent) delete it.parent;
        if(!raw.mode) delete it.mode;
        this.base.set(pre + d.id, JSON.stringify(this.itemJson(it)));
        return it;
      });
      this.renderSoon();
    }, () => {});
    this.expUnsub.set(tid, () => { off(); offI(); });
  },
  // ---- 雲端文件的樣子（欄位要跟資料庫規則一致） ----
  userDoc(){
    const lp = Store.data.lastPick || {}, me = Store.data.user || {};
    const d = {name:(me.name || "").slice(0, 60), lastPick:{cat:lp.cat || "food", acct:lp.acct || ""}};
    if(me.nick) d.nick = me.nick.slice(0, 12);
    if(me.avatar && AVATAR_RE.test(me.avatar)) d.avatar = me.avatar;
    return d;
  },
  tripDoc(t){
    const d = {name:t.name.slice(0, 24), dest:(t.dest || "").slice(0, 12), country:(t.country || "").slice(0, 20), start:t.start, end:t.end, cur:t.cur,
      accounts:t.accounts.slice(0, 20).map(a => ({id:a.id, name:a.name, method:a.method, cur:a.cur, budget:Math.round(a.budget) || 0}))};
    if(t.sample) d.sample = true;
    if(t.lists) d.lists = Object.fromEntries(LISTS.map(([k]) => [k, (t.lists[k] || []).slice(0, 30).map(c => KINDS.includes(c.kind) ? {id:c.id, name:cleanText(c.name, 16), kind:c.kind, ...(PAL.includes(c.color) ? {color:c.color} : {})} : {id:c.id, name:cleanText(c.name, 16), ...(PAL.includes(c.color) ? {color:c.color} : {})})]));
    return d;
  },
  itemJson(it){
    const d = {list:it.list, cat:it.cat, name:cleanText(it.name, 60) || "未命名", note:cleanMulti(it.note, 1000), done:!!it.done, pos:+it.pos || 0};
    if(it.parent) d.parent = it.parent;
    if(it.mode === "single" || it.mode === "store") d.mode = it.mode;
    if(it.parent || (it.qty || 1) > 1) d.qty = Math.min(999, Math.max(1, it.qty || 1));
    if(it.spec) d.spec = cleanText(it.spec, 40);
    if(Number.isInteger(it.discount) && it.discount > 0) d.discount = it.discount;
    if(it.thumb && AVATAR_RE.test(it.thumb) && it.thumb.length <= 30000) d.thumb = it.thumb;
    if(it.pcount > 0) d.pcount = Math.min(MAX_PHOTOS, it.pcount);
    if(it.who) d.who = cleanText(it.who, 12);
    if(Number.isInteger(it.price) && it.price > 0) d.price = it.price;
    if(it.paid) d.paid = true;
    return d;
  },
  expJson(e){ return {title:(e.title || "").slice(0, 40), amount:Math.round(e.amount), cur:e.cur, rate:e.rate, acct:e.acct || null, cat:e.cat, time:new Date(e.time).toISOString(), excluded:!!e.excluded}; },
  // ---- 把畫面上的資料跟雲端比對，只寫有變動的文件 ----
  sync(){
    if(this.state !== "in" || !this.db) return;
    const F = this.F, db = this.db, uid = this.uid, want = new Map();
    want.set(this.path("users", uid), {kind:"user", data:this.userDoc()});
    for(const t of Store.data.trips){
      want.set(this.path("users", uid, "trips", t.id), {kind:"trip", data:this.tripDoc(t)});
      for(const e of t.expenses) want.set(this.path("users", uid, "trips", t.id, "expenses", e.id), {kind:"exp", data:this.expJson(e)});
      for(const it of t.items || []) want.set(this.path("users", uid, "trips", t.id, "items", it.id), {kind:"item", data:this.itemJson(it)});
      // 照片：只處理這台裝置已經載入或新加的（沒載入的不會被誤刪）
      for(const ph of t.photos || []) want.set(this.path("users", uid, "trips", t.id, "photos", ph.id), {kind:"photo", data:{item:ph.item, data:ph.data, pos:ph.pos}});
    }
    const ops = [];
    for(const [path, w] of want){
      const json = JSON.stringify(w.data);
      if(this.base.get(path) === json) continue;
      this.base.set(path, json);
      const data = w.kind === "exp" ? {...w.data, time:F.Timestamp.fromDate(new Date(w.data.time))} : {...w.data};
      data.updatedAt = F.serverTimestamp();
      ops.push(["set", path, data]);
    }
    const purge = [];
    for(const path of [...this.base.keys()]) if(!want.has(path)){
      this.base.delete(path); ops.push(["del", path]);
      const seg = path.split("/");                            // 刪掉旅程或項目時，雲端上還沒載入的照片也要一起刪
      if(seg.length === 4) purge.push([seg[3], null]); else if(seg.length === 6 && seg[4] === "items") purge.push([seg[3], seg[5]]);
    }
    if(purge.length) this.purgePhotos(purge);
    // 一批最多 450 筆，分批送出；沒網路時會先存在手機，連上後自動補傳
    // 照片比較大，一批最多 20 筆（Firestore 一批上限約 10MB）
    for(let i = 0; i < ops.length; i += 20){
      const b = F.writeBatch(db);
      for(const [op, path, data] of ops.slice(i, i + 20)){ const ref = F.doc(db, path); if(op === "set") b.set(ref, data); else b.delete(ref); }
      b.commit().catch(err => { toast(err && err.code === "permission-denied" ? "資料格式不對，這次修改沒有存到雲端" : "同步失敗，請重新整理再試"); });
    }
  },
  // 打開一項時才載入它的照片（清單上只用縮圖），之後離線也看得到
  loaded:new Set(),
  async loadPhotos(t, itemId){
    const key = t.id + "/" + itemId;
    if(this.state !== "in" || !this.db || this.loaded.has(key)) return;
    this.loaded.add(key);
    try{
      const F = this.F, uid = this.uid;
      const snap = await F.getDocs(F.query(F.collection(this.db, "users", uid, "trips", t.id, "photos"), F.where("item", "==", itemId)));
      t.photos = t.photos || [];
      let added = false;
      for(const d of snap.docs){
        const x = d.data();
        if(!AVATAR_RE.test(x.data || "") || t.photos.some(q => q.id === d.id)) continue;
        const ph = {id:d.id, item:x.item, data:x.data, pos:+x.pos || 0};
        t.photos.push(ph); added = true;
        this.base.set(this.path("users", uid, "trips", t.id, "photos", d.id), JSON.stringify({item:ph.item, data:ph.data, pos:ph.pos}));
      }
      if(added) this.renderSoon();
    }catch(e){ this.loaded.delete(key); }
  },
  async purgePhotos(list){
    const F = this.F, uid = this.uid;
    for(const [tid, item] of list){
      try{
        const col = F.collection(this.db, "users", uid, "trips", tid, "photos");
        const snap = await F.getDocs(item ? F.query(col, F.where("item", "==", item)) : col);
        for(let i = 0; i < snap.docs.length; i += 20){
          const b = F.writeBatch(this.db);
          snap.docs.slice(i, i + 20).forEach(d => { b.delete(d.ref); this.base.delete(this.path("users", uid, "trips", tid, "photos", d.id)); });
          await b.commit();
        }
      }catch(e){}
    }
  },
  // 第一次登入：把這台裝置上自己記的旅程（不含範例）搬上雲端
  migrate(){
    let local = null;
    try{ local = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
    const mine = local && Array.isArray(local.trips) ? local.trips.filter(t => !t.sample) : [];
    if(!mine.length) return;
    const ids = new Set(Store.data.trips.map(t => t.id));
    const add = mine.filter(t => !ids.has(t.id));
    if(add.length){ Store.data.trips.push(...add); this.sync(); toast(`已把這台裝置的 ${add.length} 趟旅程搬上雲端`); }
    // 搬完先留一份備份（萬一上傳被擋，資料還在），再清掉原本的位置，避免下次重複搬
    try{ localStorage.setItem(KEY + ".backup", localStorage.getItem(KEY)); localStorage.removeItem(KEY); }catch(e){}
  },
  // 雲端有更新就重畫；正在打字時先等一下，避免把輸入框洗掉
  renderSoon(){
    clearTimeout(this._rt);
    this._rt = setTimeout(() => {
      const a = document.activeElement;
      if(a && a.closest && a.closest("#app") && /INPUT|TEXTAREA/.test(a.tagName)){ this.renderSoon(); return; }
      render();
    }, 60);
  }
};

/* ================= 計算 ================= */
function acctSpent(t, a){        // 用帳戶自己的幣別計算已花（不含「不計入」）
  return t.expenses.filter(e => e.acct === a.id && !e.excluded).reduce((sum, e) =>
    sum + (e.cur === a.cur ? e.amount : Math.round(twdOf(e) / CUR[a.cur].rate * unit(a.cur))), 0);
}
function totals(t){
  const budget = t.accounts.reduce((s, a) => s + Math.round(a.budget / unit(a.cur) * CUR[a.cur].rate), 0);
  const spent = t.expenses.filter(e => !e.excluded).reduce((s, e) => s + twdOf(e), 0);
  return {budget, spent, left:budget - spent};
}
function barEl(spent, budget){
  const p = budget > 0 ? spent / budget : (spent > 0 ? 1 : 0);
  const b = el("div", {class:"bar" + (p > 1 ? " over" : p >= .9 ? " warn" : ""), role:"progressbar", "aria-label":"已用預算", "aria-valuemin":"0", "aria-valuemax":"100", "aria-valuenow":String(Math.min(100, Math.round(p * 100)))}, el("i"));
  requestAnimationFrame(() => requestAnimationFrame(() => { b.firstChild.style.width = Math.min(100, p * 100) + "%"; }));
  return b;
}

  const layer = (cls, inner) => { const v = document.createElementNS(NS, "svg"); v.setAttribute("class", "layer " + cls); v.setAttribute("viewBox", "0 0 360 300"); v.setAttribute("aria-hidden", "true"); v.innerHTML = inner; return v; };
  const trail = layer("hello-trail", `<path d="${FLY}" pathLength="1" style="stroke-dasharray:1 1;stroke-dashoffset:1"/>`);
  // 雲的內部塗成背景色，擋住後面的飛機；上面再畫一條完整的線
  // 下面一條線（左下的雲往上鼓）、上面一條線（右上的雲往下垂）；雲的內部塗成背景色，擋住後面的飛機
  const land = layer("hello-land", `<path class="fill" d="M 8 205 A 13 13 0 0 1 30 196 A 26 26 0 0 1 76 176 A 18 18 0 0 1 106 190 A 12 12 0 0 1 120 205 Z"/><path class="fill" d="M 240 40 A 13 13 0 0 0 262 49 A 26 26 0 0 0 308 69 A 18 18 0 0 0 338 55 A 12 12 0 0 0 352 40 Z"/><path class="line" d="M -50 205 H 8 A 13 13 0 0 1 30 196 A 26 26 0 0 1 76 176 A 18 18 0 0 1 106 190 A 12 12 0 0 1 120 205 H 410" pathLength="1"/><path class="line" d="M 410 40 H 352 A 12 12 0 0 1 338 55 A 18 18 0 0 1 308 69 A 26 26 0 0 1 262 49 A 13 13 0 0 1 240 40 H -50" pathLength="1"/>`);
  const line = trail.firstChild, horizons = [...land.querySelectorAll(".line")];
  const plane = el("div", {class:"hello-plane", "aria-hidden":"true"});
  plane.innerHTML = '<svg viewBox="0 0 32 32"><path d="M30 16c0-1.1-.9-2-2-2h-8.5L12 3H9l4 11H6.5L4 11H2l1.5 5L2 21h2l2.5-3H13L9 29h3l7.5-11H28c1.1 0 2-.9 2-2Z"/></svg>';
  const word = el("p", {class:"hello-word", text:"歡迎"});
  const sub = el("p", {class:"hello-sub", text:name ? `${name}，一起出發吧` : "一起出發吧"});
  // 疊放順序：飛機雲 → 文字 → 飛機 → 雲與地平線（雲蓋在飛機上面）
  const stage = el("div", {class:"hello-stage"}, trail, word, sub, plane, land);
  const box = el("div", {class:"hello" + (calm ? " calm" : ""), role:"status", "aria-label":"歡迎"}, stage);
  document.body.append(box);
  render();                                                    // 動畫蓋住畫面後，底下換成我的旅程
  const fit = () => { stage.style.scale = String(Math.min(1, (innerWidth - 32) / 360)); };
  fit(); addEventListener("resize", fit);
  const timers = [], anims = [];
  let raf = 0, ended = false;
  const finish = () => {
    if(ended) return; ended = true;
    timers.forEach(clearTimeout); cancelAnimationFrame(raf); removeEventListener("resize", fit);
    const o = {duration:700, easing:"cubic-bezier(.4,0,.2,1)", fill:"forwards"};
    anims.push(word.animate([{transform:"none"}, {transform:"translateY(-10px)"}], o));
    if(!calm) horizons.forEach(h => { h.getAnimations().forEach(a => a.cancel()); anims.push(h.animate([{strokeDashoffset:"0"}, {strokeDashoffset:"-1"}], o)); });   // 兩條線順著畫的方向收掉，跟開頭呼應
    box.classList.add("out"); render();                       // 重畫首頁，讓卡片的進場動畫在淡出時播放
    setTimeout(() => { anims.forEach(a => a.cancel()); box.remove(); }, 750);
  };
  box.addEventListener("click", finish);
  if(calm){
    trail.remove(); plane.remove();
    timers.push(setTimeout(() => word.classList.add("on"), 100), setTimeout(() => sub.classList.add("on"), 600), setTimeout(finish, 2600));
    return;
  }
  // ① 下面的線從左往右、上面的線從右往左，同時畫出來
  horizons.forEach(h => { h.style.strokeDasharray = "1 1"; anims.push(h.animate([{strokeDashoffset:"1"}, {strokeDashoffset:"0"}], {duration:1400, easing:"cubic-bezier(.45,.05,.3,1)", fill:"both"})); });
  // ② 飛機：依路徑長度找出經過文字的區段——鑽出雲後滑入、經過文字等速、最後加速鑽進雲
  let a = .2, b = .75;
  try{
    const total = line.getTotalLength();
    const at = x => { let lo = 0, hi = total; for(let i = 0; i < 24; i++){ const m = (lo + hi) / 2; if(line.getPointAtLength(m).x < x) lo = m; else hi = m; } return lo / total; };
    a = at(114); b = at(240);
  }catch(e){}
  const D = 2300, T = {duration:D, delay:700, fill:"both"};
  const keys = f => [
    {...f(0), easing:"cubic-bezier(.3,.2,.5,1)"},
    {...f(a), offset:.22, easing:"linear"},
    {...f(b), offset:.74, easing:"cubic-bezier(.5,0,.9,.6)"},
    {...f(1)}];
  anims.push(plane.animate(keys(d => ({offsetDistance:d * 100 + "%"})), T));
  anims.push(line.animate(keys(d => ({strokeDashoffset:String(1 - d)})), T));
  anims.push(plane.animate([{opacity:0}, {opacity:1, offset:.04}, {opacity:1, offset:.95}, {opacity:0}], T));   // 在雲裡才出現、進到雲裡就真的不見
  anims.push(plane.firstChild.animate([{transform:"scale(.7)"}, {transform:"scale(1)", offset:.22}, {transform:"scale(1)", offset:.74}, {transform:"scale(.8)"}], {...T, easing:"ease-in-out"}));
  // 「歡迎」跟著飛機的位置一點一點露出來
  const reveal = () => {
    const w = word.getBoundingClientRect(), p = plane.getBoundingClientRect();
    const k = w.width / word.offsetWidth || 1;                 // 畫面縮放比例
    const x = (p.left + p.width * .55 - w.left) / k;           // 飛機在文字上的位置（文字自己的座標）
    const m = `linear-gradient(90deg,#000 ${x - 40}px,transparent ${x}px)`;   // 邊緣柔和地淡入，像墨水暈開
    word.style.webkitMaskImage = m; word.style.maskImage = m;
    if(x - 40 < word.offsetWidth && !ended) raf = requestAnimationFrame(reveal);
    else { word.style.webkitMaskImage = "none"; word.style.maskImage = "none"; }
  };
  raf = requestAnimationFrame(reveal);
  timers.push(
    setTimeout(() => { line.style.opacity = "0"; }, 700 + D * .9),
    setTimeout(() => sub.classList.add("on"), 700 + D * .8),
    setTimeout(finish, 700 + D + 450));
}

// 頭貼：只顯示使用者自己選、在手機上重新壓過的 JPEG；沒有就顯示暱稱第一個字
const AVATAR_RE = /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/;
const nickOf = u => (u && (u.nick || (u.guest ? "訪客" : u.name))) || "我";
function avatarFace(u, b = el("span", {class:"me-btn", "aria-hidden":"true"})){
  if(u.avatar && AVATAR_RE.test(u.avatar)) b.append(el("img", {src:u.avatar, alt:"", width:36, height:36}));
  else b.textContent = [...nickOf(u)][0];
  return b;
}
const avatarBtn = u => avatarFace(u, el("button", {type:"button", class:"me-btn", "aria-label":"帳號", onclick:openMe}));
// 暱稱：去掉看不見的控制字元（含會讓文字反向顯示的字元），最多 12 字
const cleanText = (v, n) => [...String(v || "").replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2060-\u206f\ufeff]/g, "").trim()].slice(0, n).join("");
const cleanNick = v => cleanText(v, 12);
// 選好的照片：只收 JPG／PNG → 置中裁成正方形 → 縮成 192×192 → 重新存成 JPEG
// 重新畫一次就不會帶著原檔的拍攝地點（GPS）等資訊，原始照片也不會上傳
// square：裁成正方形（頭貼）；否則保留比例，長邊縮到 max（清單照片）。limit 是存檔字數上限（要跟資料庫規則一致）
async function makeImage(file, max, square, limit){
  if(!file || !/^image\/(jpeg|png)$/.test(file.type)) throw "type";
  if(file.size > 25 * 1024 * 1024) throw "size";
  const url = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(file); });
  const img = new Image(); img.src = url; await img.decode();
  const w = img.naturalWidth, h = img.naturalHeight, side = Math.min(w, h);
  if(!side) throw "decode";
  for(const [m, q] of [[max, .82], [max, .68], [Math.round(max * .75), .62]]){
    const k = square ? m / side : Math.min(1, m / Math.max(w, h));
    const cw = square ? m : Math.round(w * k), ch = square ? m : Math.round(h * k);
    const c = document.createElement("canvas"); c.width = cw; c.height = ch;
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, cw, ch);           // 透明的 PNG 墊白底
    g.imageSmoothingQuality = "high";
    if(square) g.drawImage(img, (w - side) / 2, (h - side) / 2, side, side, 0, 0, cw, ch);
    else g.drawImage(img, 0, 0, cw, ch);
    const out = c.toDataURL("image/jpeg", q);
    if(out.length <= limit && AVATAR_RE.test(out)) return out;
  }
  throw "big";
}
const makeAvatar = file => makeImage(file, 192, true, 60000);
// 清單照片：要能放大給店員看，留大一點；只存在手機上（示範／訪客）時縮小一點，免得塞爆手機空間
const makePhoto = file => CLOUD && !Store.guest ? makeImage(file, 1280, false, 380000) : makeImage(file, 1080, false, 220000);
/* ===== 照片：每一項最多 10 張；每張分開存（雲端放在 photos），清單上只用小縮圖，點開才載入大圖 ===== */
const MAX_PHOTOS = 10;
const photosOf = (t, it) => (t.photos || []).filter(x => x.item === it.id).sort((a, b) => a.pos - b.pos);
const thumbOf = (t, it) => it.thumb && AVATAR_RE.test(it.thumb) ? it.thumb : (photosOf(t, it)[0] || {}).data || "";
const photoCount = (t, it) => Math.max(photosOf(t, it).length, it.pcount || 0);
async function thumbFrom(src){
  const img = new Image(); img.src = src; await img.decode();
  const side = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement("canvas"); c.width = c.height = 144;
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, 144, 144); g.imageSmoothingQuality = "high";
  g.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 144, 144);
  return c.toDataURL("image/jpeg", .72);
}
async function refreshThumb(t, it){
  const ps = photosOf(t, it); it.pcount = ps.length;
  try{ it.thumb = ps.length ? await thumbFrom(ps[0].data) : ""; }catch(e){ it.thumb = ""; }
}
// 加照片：一次可以選好幾張，總數最多 10 張
async function addPhotos(t, it, files){
  const have = photoCount(t, it), room = MAX_PHOTOS - have, list = [...files].slice(0, Math.max(0, room));
  if(room <= 0){ toast(`每一項最多 ${MAX_PHOTOS} 張照片`); return; }
  if(files.length > room) toast(`最多 ${MAX_PHOTOS} 張，這次只加了 ${room} 張`);
  t.photos = t.photos || [];
  let pos = photosOf(t, it).reduce((m, x) => Math.max(m, x.pos), 0), bad = 0;
  for(const f of list){
    try{ t.photos.push({id:uid("p"), item:it.id, data:await makePhoto(f), pos:++pos}); }
    catch(e){ bad++; }
  }
  if(bad) toast(bad === list.length ? "照片讀不出來，只能選 JPG 或 PNG" : `有 ${bad} 張讀不出來，已略過`);
  await refreshThumb(t, it); Store.save();
}
async function removePhoto(t, it, pid){ t.photos = (t.photos || []).filter(x => x.id !== pid); await refreshThumb(t, it); Store.save(); }
async function coverPhoto(t, it, pid){
  const ps = photosOf(t, it), x = ps.find(q => q.id === pid); if(!x) return;
  x.pos = (ps[0] ? ps[0].pos : 1) - 1; await refreshThumb(t, it); Store.save();
}
// 舊資料：以前每一項只有一張照片（photo 欄位），搬到新的照片格式
function migratePhotos(t){
  for(const it of t.items || []) if(it.photo && AVATAR_RE.test(it.photo)){
    t.photos = t.photos || [];
    if(!t.photos.some(x => x.item === it.id)) t.photos.push({id:uid("p"), item:it.id, data:it.photo, pos:1});
    it.photo = ""; it.pcount = Math.max(1, it.pcount || 0);
    refreshThumb(t, it).then(() => { Store.save(); });
  }
}

// 個人資料的編輯元件：頭貼選擇＋暱稱輸入；D 是草稿（{nick, avatar}），畫面重畫也不會弄丟

function dayLine(trips){
  const today = ymd(new Date()), epochDay = Math.floor(parseYmd(today) / 864e5);
  const seedOf = t => [...t.id].reduce((a, c) => a + c.charCodeAt(0), 0);
  const fill = (str, t, n) => str.replace(/\{城市\}/g, t.dest || t.name).replace(/\{n\}/g, n).replace(/\{幣別\}/g, CUR[t.cur] ? CUR[t.cur].name : "外幣");
  const pick = (arr, k) => arr[((k % arr.length) + arr.length) % arr.length];
  const d = trips.find(t => phase(t).key === "during");
  if(d){
    const n = dayDiff(d.start, today) + 1, sd = seedOf(d);
    if(n === 1) return fill(pick(LINES.first, sd), d, n);
    if(today === d.end) return fill(pick(LINES.last, sd), d, n);
    return fill(pick(LINES.during, n - 2 + sd), d, n);   // 第 n 天挑第 n 句：整趟旅程每天不重複
  }
  const b = trips.filter(t => phase(t).key === "before").sort((x, y) => x.start.localeCompare(y.start))[0];
  if(b){
    const n = dayDiff(today, b.start);
    let pool = n === 1 ? LINES.tomorrow : n <= 7 ? LINES.week : n <= 30 ? LINES.month : n <= 90 ? LINES.plan : LINES.far;
    if(pool === LINES.month && b.cur === "TWD") pool = pool.filter(x => !x.includes("{幣別}"));
    return fill(pick(pool, epochDay + seedOf(b)), b, n);
  }
  const a = trips.filter(t => phase(t).key === "after").sort((x, y) => y.end.localeCompare(x.end))[0];
  if(a) return fill(pick(dayDiff(a.end, today) <= 7 ? LINES.back : LINES.memory, epochDay + seedOf(a)), a, 0);
  return LINES.none[0];
}

function openSheet({title, done = "完成", body, onDone}){
  if(sheetOpen) sheetOpen(true);
  const scrim = el("div", {class:"scrim"});
  const cancel = el("button", {type:"button", text:"取消"});
  const ok = el("button", {type:"button", class:"done", text:done});
  const sheet = el("div", {class:"sheet", role:"dialog", "aria-modal":"true", "aria-label":title}, el("div", {class:"sheet-h"}, cancel, el("h2", {text:title}), ok), body);

  document.documentElement.style.overflow = "hidden";
  requestAnimationFrame(() => requestAnimationFrame(() => { scrim.classList.add("on"); sheet.classList.add("on"); }));
  const close = instant => {

    if(subPage){ const sp = subPage; subPage = null; sp.classList.remove("on"); setTimeout(() => sp.remove(), 450); }

  sheet.addEventListener("touchmove", e => { if(sy == null) return; const dy = Math.max(0, e.touches[0].clientY - sy); sheet.style.transition = "none"; sheet.style.transform = `translate(-50%,${dy}px)`; }, {passive:true});

// ---- 滾輪（像 iPhone 鬧鐘）：原生捲動＋吸附，所以慣性滑動很順；每個影格只更新畫面上看得到的幾項 ----
// items: [{v, label}]；onChange(值, 是否已停下)
function wheel(items, value, onChange, width){
  const H = 36;
  const w = el("div", {class:"wheel", tabIndex:0, role:"listbox", style:`width:${width}px`});
  w.append(el("div", {class:"pad"}));
  const nodes = items.map((it, i) => el("div", {class:"it", role:"option", text:it.label, onclick:() => go(i, true)}));
  w.append(...nodes, el("div", {class:"pad"}));
  let idx = Math.max(0, items.findIndex(it => it.v === value)), raf = 0, settleT, lastTick = 0;
  const paint = () => {
    raf = 0;
    const f = w.scrollTop / H, lo = Math.max(0, Math.floor(f) - 4), hi = Math.min(items.length - 1, Math.ceil(f) + 4);
    for(let i = lo; i <= hi; i++){
      const d = i - f, a = Math.abs(d);
      nodes[i].style.transform = `rotateX(${(-d * 20).toFixed(2)}deg) scale(${(1 - Math.min(a, 4) * .035).toFixed(3)})`;
      nodes[i].style.opacity = Math.max(.12, 1 - a * .28).toFixed(2);
    }
    const r = Math.min(items.length - 1, Math.max(0, Math.round(f)));
    if(r !== idx){
      idx = r; onChange(items[idx].v, false);
      const now = performance.now(); if(now - lastTick > 40){ lastTick = now; try{ if(navigator.vibrate) navigator.vibrate(3); }catch(e){} }
    }
  };
  const go = (i, smooth) => { i = Math.max(0, Math.min(items.length - 1, i)); w.scrollTo({top:i * H, behavior:smooth ? "smooth" : "auto"}); };
  w.addEventListener("scroll", () => {
    if(!raf) raf = requestAnimationFrame(paint);
    clearTimeout(settleT); settleT = setTimeout(() => onChange(items[idx].v, true), 140);
  }, {passive:true});
  w.addEventListener("keydown", e => { if(e.key === "ArrowDown"){ e.preventDefault(); go(idx + 1, true); } if(e.key === "ArrowUp"){ e.preventDefault(); go(idx - 1, true); } });
  w.setTo = (v, smooth) => { const i = items.findIndex(it => it.v === v); if(i < 0) return; idx = i; go(i, smooth); if(!smooth) paint(); };
  w.mark = test => nodes.forEach((n, i) => n.classList.toggle("off", !!test(items[i].v)));
  w.refresh = () => { w.scrollTop = idx * H; paint(); };
  return w;
}
// 年／月／日 三個滾輪；不存在的日子（例如 11 月 31 日）變淡，停在那裡會自動退回月底
function dateWheels(value, onChange){
  const d0 = parseYmd(value), now = new Date().getFullYear();
  const st = {y:d0.getFullYear(), m:d0.getMonth() + 1, d:d0.getDate()};
  // 年份：往前 10 年（補記舊旅程）、往後 20 年
  const years = []; for(let y = Math.min(now - 10, st.y); y <= Math.max(now + 20, st.y); y++) years.push({v:y, label:`${y} 年`});
  const range = (n, f) => Array.from({length:n}, (_, i) => ({v:i + 1, label:f(i + 1)}));
  const dim = () => new Date(st.y, st.m, 0).getDate();
  const emit = settled => {
    const max = dim(); dw.mark(v => v > max);
    if(st.d > max){ if(settled){ st.d = max; dw.setTo(max, true); } }
    onChange(ymd(new Date(st.y, st.m - 1, Math.min(st.d, max))), settled);
  };
  const yw = wheel(years, st.y, (v, s) => { st.y = v; emit(s); }, 104);
  const mw = wheel(range(12, m => `${m} 月`), st.m, (v, s) => { st.m = v; emit(s); }, 76);
  const dw = wheel(range(31, d => `${d} 日`), st.d, (v, s) => { st.d = v; emit(s); }, 76);
  const box = el("div", {class:"wheels", role:"group", "aria-label":"選擇日期"}, yw, mw, dw);
  return {el:box,
    set(v, smooth){ const d = parseYmd(v); st.y = d.getFullYear(); st.m = d.getMonth() + 1; st.d = d.getDate(); yw.setTo(st.y, smooth); mw.setTo(st.m, smooth); dw.setTo(st.d, smooth); dw.mark(x => x > dim()); },
    refresh(){ [yw, mw, dw].forEach(w => w.refresh()); dw.mark(x => x > dim()); }};
}
// 出發／回程：各自展開一組年月日滾輪，按「確認」收起；回程不會早於出發
function dateRange(start0, end0){
  const ds = {start:start0, end:end0};
  const sv = el("span", {class:"val"}), ev = el("span", {class:"val"});
  const len = el("span", {class:"hint"});
  const sync = () => {
    sv.textContent = fmtDate(ds.start); ev.textContent = fmtDate(ds.end);
    sv.classList.toggle("on", sx.isOpen()); ev.classList.toggle("on", ex.isOpen());
    len.textContent = `共 ${dayDiff(ds.start, ds.end) + 1} 天`;
  };
  const sW = dateWheels(ds.start, (v, settled) => {
    const keep = dayDiff(ds.start, ds.end);
    ds.start = v;
    if(ds.end < ds.start){ ds.end = ymd(addDays(parseYmd(v), Math.max(0, keep))); eW.set(ds.end, false); }
    sync();
  });
  const eW = dateWheels(ds.end, (v, settled) => {
    ds.end = v < ds.start ? ds.start : v;
    if(settled && v < ds.start) eW.set(ds.start, true);   // 回程比出發早：滾回出發那天
    sync();

    const ok = el("button", {type:"button", class:"cal-ok", text:"確認", onclick:() => { x.close(); sync(); }});
    const x = expander(el("div", {class:"pk"}, w.el, el("div", {class:"cal-foot"}, which === "end" ? len : el("span"), ok)));
    return x;
  };
  const sx = panel(sW, "start"), ex = panel(eW, "end");
  const toggle = (x, w) => { if(x.isOpen()){ x.close(); sync(); return; } x.open(); w.set(x === sx ? ds.start : ds.end, false); requestAnimationFrame(() => w.refresh()); sync(); };

}
// 記帳時間：日期（含星期）＋時＋分，三個滾輪

function swipeDel(row, onDelete, o = {}){
  const w = o.w || 84;
  row.classList.add("swipable");
  const btn = el("span", {class:"sw-del", role:"button", text:o.label || "刪除"});
  row.append(btn);
  let x = 0;
  const set = (v, anim) => { x = v; row.classList.toggle("sw-anim", !!anim); row.style.setProperty("--sx", -v + "px"); row.style.setProperty("--sw", v + "px"); row.classList.toggle("sw-on", v > 0); };
  const close = anim => { set(0, anim); if(swOpen && swOpen.row === row) swOpen = null; };
  btn.addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    if(onDelete() === false) close(true); else if(swOpen && swOpen.row === row) swOpen = null;
  });
  row.addEventListener("pointerdown", e => {
    if(e.button > 0 || !e.isPrimary || (e.target.closest && e.target.closest(".sw-del, .handle, .kgrip"))) return;
    const sx = e.clientX, sy = e.clientY, base = x, pid = e.pointerId; let on = false;

    };

// 金額：只留數字與小數點，依幣別限制小數位，打字時加千分位
function parseAmount(str, cur){
  const s = String(str).replace(/[^\d.]/g, "");

  const v = Number(s);

}
function cleanAmount(inp, cur){
  let s = inp.value.replace(/[^\d.]/g, "");
  const dec = CUR[cur].dec;
  if(dec === 0) s = s.replace(/\./g, "");
  else { const [a, ...b] = s.split("."); s = b.length ? a + "." + b.join("").slice(0, dec) : a; }

  s = i.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + (f !== undefined ? "." + f : "");
  if(inp.value !== s){ inp.value = s; try{ inp.setSelectionRange(s.length, s.length); }catch(e){} }
}

    rects.forEach((r, k) => { const m = (r.top + r.bottom) / 2; if(k > i && c > m) j = Math.max(j, k); if(k < i && c < m) j = Math.min(j, k); });

  const flip = change => {
    const els = [...list.querySelectorAll(".li:not(.lifted), .lcat-h")];
    const before = new Map(els.map(e => [e, e.getBoundingClientRect().top]));

// 同一組裡長按拖動排序（店家裡的商品用）
function enableSort(box, onMove){
  box.querySelectorAll(".li.sitem").forEach(row => {
    row.addEventListener("pointerdown", e => {
      if(e.button > 0 || !e.isPrimary || e.target.closest(".ck, .pic")) return;
      const sx = e.clientX, sy = e.clientY, pid = e.pointerId;
      if(e.target.closest(".kgrip")){ e.preventDefault(); box._suppressClick = true; dragSession(box, ".li.sitem", row, sy, onMove, row, pid); return; }
      let timer;
      const stop = () => { clearTimeout(timer); row.classList.remove("pressing"); row.removeEventListener("pointermove", mv); row.removeEventListener("pointerup", stop); row.removeEventListener("pointercancel", stop); };
      const mv = ev => { if(ev.pointerId === pid && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) stop(); };
      row.addEventListener("pointermove", mv); row.addEventListener("pointerup", stop); row.addEventListener("pointercancel", stop);
      row.classList.add("pressing");
      timer = setTimeout(() => {
        stop(); box._suppressClick = true;
        try{ if(navigator.vibrate) navigator.vibrate(12); }catch(err){}
        if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
        dragSession(box, ".li.sitem", row, sy, onMove, row, pid);
      }, 380);
    });
  });
  box.addEventListener("click", e => { if(box._suppressClick){ e.preventDefault(); e.stopPropagation(); box._suppressClick = false; } }, true);
  box.addEventListener("contextmenu", e => { if(e.target.closest(".li.sitem")) e.preventDefault(); });
}
// 給誰：用過的名字列成小膠囊，可以新增（頁面上和編輯表單共用）
function whoChips(cur, onPick){
  let who = cur || "";
  const names = [...new Set(Store.data.trips.flatMap(x => (x.items || []).map(i => i.who)).filter(Boolean))];
  if(who && !names.includes(who)) names.push(who);
  const chips = el("div", {class:"chips", role:"group", "aria-label":"給誰"});
  const paint = () => {
    const add = el("button", {type:"button", class:"chip add"}, icon("plus", 14, 2), el("span", {text:"新增"}));
    add.addEventListener("click", () => {
      const inp = el("input", {class:"chip-in", maxLength:12, placeholder:"名字", autocomplete:"off", enterkeyhint:"done", "aria-label":"新增名字"});
      let ended = false;                                     // Enter 之後會再觸發一次 blur，只處理第一次
      const done = () => { if(ended) return; ended = true; const v = cleanText(inp.value, 12); if(v){ if(!names.includes(v)) names.push(v); who = v; onPick(who); } paint(); };
      inp.addEventListener("keydown", e => { if(e.key === "Enter" && !e.isComposing){ e.preventDefault(); done(); } if(e.key === "Escape"){ ended = true; paint(); } });
      inp.addEventListener("blur", done);
      add.replaceWith(inp); inp.focus();
    });
    chips.replaceChildren(...names.map(n => el("button", {type:"button", class:"chip", "aria-pressed":String(n === who), text:n, onclick:() => { who = who === n ? "" : n; onPick(who); paint(); }})), add);
  };
  paint(); chips.get = () => who;
  return chips;
}

    reset, out),
    CLOUD ? el("p", {class:"hint", style:"margin:8px 16px 0", text:"登出時會一併清除這台裝置上的資料副本，雲端的資料不受影響。"}) : null,
    CLOUD ? el("div", {class:"grp"}, el("button", {type:"button", class:"menu-btn red", style:"border-top:0", onclick:openDeleteAccount, text:"刪除帳號"})) : null,
    CLOUD ? el("p", {class:"hint", style:"margin:8px 16px 0", text:"刪除帳號會永久刪除所有旅程與記帳，無法復原。"}) : null,
    about());
  const {close} = openSheet({title:"帳號", done:"完成", body, onDone:() => close()});
  if(reset) reset.addEventListener("click", () => { Store.data.trips = sampleTrips(); Store.save(); close(); go("home"); toast("範例資料已重設"); });
  out.addEventListener("click", () => {
    if(CLOUD){ out.disabled = true; out.textContent = "登出中…"; Cloud.signOut(); return; }
    Store.data.user = null; Store.save(); close(); go("home");
  });
}

// 訪客的帳號頁：綁定 Google（資料搬上雲端），或清除資料離開
function openGuestMe(){
  const bind = el("button", {type:"button", class:"menu-btn", text:"綁定 Google 帳號"});
  const leave = el("button", {type:"button", class:"menu-btn red", text:"清除資料並離開"});
  const pic = avatarFace(Store.data.user);
  const n = Store.data.trips.length;
  const body = el("div", null,
    el("div", {class:"grp"}, el("button", {type:"button", class:"me", "aria-label":"編輯個人資料", onclick:() => openProfile()}, pic,
      el("div", {class:"grow"}, el("b", {text:nickOf(Store.data.user)}), el("span", {class:"e", text:"訪客・資料只存在這台裝置"})), el("span", {class:"chev"}, icon("chev", 18, 2))), bind),
    el("p", {class:"hint", style:"margin:8px 16px 0", text:"綁定後，這台裝置上的旅程會一起搬上雲端，換手機也不會不見。"}),
    el("div", {class:"grp"}, Object.assign(leave, {style:"border-top:0"})),
    el("p", {class:"hint", style:"margin:8px 16px 0", text:n ? `訪客資料沒有備份，清除後這 ${n} 趟旅程會永久消失。` : "訪客資料沒有備份，清除後無法復原。"}),
    about());
  const {close} = openSheet({title:"帳號", done:"完成", body, onDone:() => close()});
  bind.addEventListener("click", () => {
    if(Cloud.state === "loading"){ toast("登入服務還在載入，請稍等一下"); return; }
    if(Cloud.state === "error"){ toast(Cloud.error); return; }
    close(); Cloud.signIn();
  });
  let armed = false, tm;
  leave.addEventListener("click", () => {
    if(!armed){
      armed = true; leave.classList.add("armed"); leave.textContent = "再按一次，資料會永久消失";
      tm = setTimeout(() => { armed = false; leave.classList.remove("armed"); leave.textContent = "清除資料並離開"; }, 4000); return;
    }
    clearTimeout(tm);
    try{ localStorage.removeItem(KEY); localStorage.removeItem(GUEST_KEY); }catch(e){}
    Store.data = {user:null, trips:[]}; close(); go("home"); toast("訪客資料已清除");
  });
}

// 刪除帳號：講清楚會消失什麼 → 輸入「刪除」→ 再登入一次確認本人 → 刪除
function openDeleteAccount(){
  const trips = Store.data.trips.filter(t => !t.sample), n = trips.length, m = trips.reduce((s, t) => s + t.expenses.length, 0);
  const input = el("input", {type:"text", class:"confirm-in", placeholder:"在這裡輸入", autocomplete:"off", autocapitalize:"off", spellcheck:"false", "aria-label":"輸入「刪除」確認"});
  const btn = el("button", {type:"button", class:"wide-btn bad", disabled:true, text:"永久刪除帳號"});
  const body = el("div", null,
    el("div", {class:"alert bad"}, el("div", {class:"ic"}, icon("alert", 26, 1.7)), el("h3", {text:"永久刪除帳號"}), el("p", {text:"刪除後無法復原，以下資料會立即從雲端消失："})),
    el("div", {class:"grp"},
      el("div", {class:"fact"}, icon("plane", 20, 1.7), el("span", {text:n ? `${n} 趟旅程、${m} 筆記帳` : "所有旅程與記帳"})),
      el("div", {class:"fact"}, icon("phone", 20, 1.7), el("span", {text:"所有裝置上的資料，其他手機和電腦也會一起消失"})),
      el("div", {class:"fact"}, icon("user", 20, 1.7), el("span", {text:"你在旅遊小幫手的帳號與設定"}))),
    el("p", {class:"grp-lab", text:"請輸入「刪除」兩個字確認"}),
    el("div", {class:"grp"}, input),
    el("p", {class:"hint", style:"margin:8px 16px 0", text:"為了確認是你本人，按下後會請你再登入一次 Google。"}),
    btn);
  const {close, ok} = openSheet({title:"刪除帳號", body});
  ok.style.visibility = "hidden";
  input.addEventListener("input", () => { btn.disabled = input.value.trim() !== "刪除"; });
  btn.addEventListener("click", async () => {
    if(!navigator.onLine){ toast("需要連上網路才能刪除帳號"); return; }
    btn.disabled = true; input.disabled = true; btn.textContent = "確認身分中…";
    const done = await Cloud.deleteAccount(step => { btn.textContent = step; });
    if(!done){ btn.textContent = "永久刪除帳號"; input.disabled = false; btn.disabled = input.value.trim() !== "刪除"; }
  });
}

Store.load();
render();
try{ if(sessionStorage.getItem("travelHelper.bye")){ sessionStorage.removeItem("travelHelper.bye"); setTimeout(() => toast("帳號已刪除，所有資料都清除了"), 400); } }catch(e){}
refreshRates();
if(CLOUD){
  Cloud.init();
  addEventListener("online", () => render()); addEventListener("offline", () => render());
}
</script>
