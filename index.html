<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅遊小幫手</title>
<meta name="description" content="出國記帳、預算、統計與匯率換算的旅遊小幫手。">
<meta name="apple-mobile-web-app-title" content="旅遊小幫手">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap">
<style>
/* Layout: 與「貓咪照顧小幫手」同一套設計語言——白底標題區＋淺灰色帶，白色卡片不加框不加陰影，細線分隔，藍色只用在可以按的東西 */
:root{
  color-scheme:light;
  --bg:#ffffff;
  --band:#f5f5f7;
  --ink:#1d1d1f;
  --muted:#6e6e73;
  --faint:#a1a1a6;
  --line:#d2d2d7;
  --hair:#e8e8ed;
  --soft:#f5f5f7;
  --blue:#0071e3;
  --link:#0066cc;
  --blue-soft:rgba(0,113,227,.09);
  --sage:#4f8a74;--sage-soft:#dfeee8;
  --bad:#b83226;--bad-soft:#f9e0dd;
  --font:"Noto Serif TC","Source Han Serif TC","Noto Serif CJK TC","PMingLiU",serif;
  --ease:cubic-bezier(.28,.11,.32,1);
  --spring:cubic-bezier(.34,1.36,.64,1);
  --col:640px;
}
/* 刻意只用白底黑字的淺色主題，和貓咪照顧小幫手一致 */
*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums lining-nums}
.ico{display:inline-grid;place-items:center;flex:none}
.ico svg{display:block}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:var(--col);margin:0 auto}
.band{background:var(--band);padding-block:28px calc(120px + env(safe-area-inset-bottom,0px))}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.screen{display:flex;flex-direction:column;min-height:100vh;animation:fadeIn .35s var(--ease)}
.screen > .band{flex:1}

/* ===== 登入 ===== */
.login{min-height:100vh;display:grid;align-content:center;justify-items:center;text-align:center;padding-block:64px 48px}
.login h1{font-size:clamp(2.6rem,9vw,3.5rem);font-weight:600;letter-spacing:-.015em;line-height:1.1;margin:0;animation:rise .7s var(--ease) both}
.login .lede{margin:22px 0 0;font-size:1.1875rem;line-height:1.8;animation:rise .7s .08s var(--ease) both}
.login .lede span{display:block}
.g-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:44px;height:50px;padding:0 28px;border:0;border-radius:980px;background:var(--ink);color:#fff;font-size:1rem;font-weight:500;letter-spacing:.02em;cursor:pointer;transition:transform .2s var(--ease),background .2s;animation:rise .7s .16s var(--ease) both}
@media (hover:hover){.g-btn:hover{background:#000}}
.g-btn:active{transform:scale(.96)}
.login small{display:block;margin-top:16px;color:var(--muted);font-size:.8125rem;animation:rise .7s .22s var(--ease) both}

/* ===== 頂部 ===== */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px}
.back{display:inline-flex;align-items:center;gap:2px;height:44px;margin-left:-6px;padding:0 8px 0 2px;border:0;border-radius:10px;background:transparent;color:var(--link);font-size:1rem;cursor:pointer;transition:opacity .2s}
.back:active{opacity:.5}
.text-btn{height:44px;padding:0 2px;border:0;background:transparent;color:var(--link);font-size:1rem;cursor:pointer;transition:opacity .2s}
.text-btn:active{opacity:.5}
/* 選單列（按下去進到下一頁） */
.line.go{width:100%;border-left:0;border-right:0;border-bottom:0;background:transparent;text-align:left;cursor:pointer;transition:background .2s}
.line.go:first-child{border-top:0}
.line.go:active{background:var(--soft)}
.line.go .val{flex:1;min-width:0;text-align:right;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line.go .chev{color:var(--faint);transform:rotate(180deg)}
.line.go:disabled{cursor:default}
.line.go:disabled .val{color:var(--muted)}
/* 第二層頁面：從右邊滑進來（iOS 的導覽方式） */
.subpage{position:fixed;left:50%;bottom:0;z-index:43;display:flex;flex-direction:column;width:min(100%,var(--col));height:min(86vh,calc(100vh - 28px - env(safe-area-inset-top,0px)));background:var(--band);border-radius:16px 16px 0 0;transform:translate(calc(-50% + 100vw),0);transition:transform .45s cubic-bezier(.22,1,.36,1);box-shadow:-10px 0 30px rgba(0,0,0,.06)}
.subpage.on{transform:translate(-50%,0)}
.subpage .sheet-h{position:static;margin:0;padding:0 max(16px,env(safe-area-inset-left,0px));border-radius:16px 16px 0 0}
.subpage .back{margin-left:-6px;justify-self:start}
.search{position:relative;margin:2px max(16px,env(safe-area-inset-left,0px)) 6px}
.search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:38px;padding:0 12px 0 34px;border:0;border-radius:10px;background:rgba(120,120,128,.12);font-size:16px;color:var(--ink)}
.search input:focus{outline:none}
.search input::placeholder{color:var(--muted)}
.sub-list{flex:1;overflow:auto;overscroll-behavior:contain;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sub-list .grp-lab{margin:18px 16px -14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 16px;border:0;border-top:1px solid var(--hair);background:transparent;text-align:left;cursor:pointer;transition:background .2s}
.opt:first-child{border-top:0}
.opt:active{background:var(--soft)}
.opt .nm{flex:1;min-width:0}
.opt .cd{color:var(--muted);font-size:.875rem;letter-spacing:.04em}
.opt .ck{width:20px;color:var(--blue);opacity:0;transition:opacity .2s}
.opt[aria-selected="true"] .ck{opacity:1}
.opt[aria-selected="true"] .nm{font-weight:600}
.no-hit{padding:32px 0;text-align:center;color:var(--muted)}
.me-btn{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:50%;background:var(--soft);color:var(--ink);font-weight:600;font-size:.9375rem;cursor:pointer;transition:transform .2s var(--ease),background .2s}
.me-btn:active{transform:scale(.92)}
.head{padding-block:8px 32px}
.head h1{font-size:clamp(2.2rem,7vw,2.75rem);font-weight:600;letter-spacing:-.012em;line-height:1.15;margin:0;text-wrap:balance;animation:rise .6s var(--ease) both}
.head p{margin:8px 0 0;color:var(--muted);font-size:1.0625rem;animation:rise .6s .06s var(--ease) both}

/* ===== 卡片與列 ===== */
.card{background:#fff;border-radius:18px;padding:6px 22px;min-width:0}
.stack{display:grid;gap:16px}
.rise{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms)}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:.8125rem;white-space:nowrap;line-height:1.6}
.pill.before{background:var(--sage-soft);color:var(--sage)}
.pill.during{background:var(--blue-soft);color:var(--link)}
.pill.after{background:var(--soft);color:var(--muted)}
.link-btn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0;border:0;background:transparent;color:var(--link);font-size:1rem;cursor:pointer;transition:opacity .2s}
.link-btn:active{opacity:.5}
.foot-note{margin:28px 4px 0;color:var(--muted);font-size:.8125rem;line-height:1.7}

/* 旅程卡 */
.trip{display:block;width:100%;padding:0 22px;border:0;border-radius:18px;background:#fff;text-align:left;cursor:pointer;transition:transform .45s var(--spring),box-shadow .35s var(--ease)}
@media (hover:hover){.trip:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.10),0 2px 8px rgba(0,0,0,.05)}}
.trip:active{transform:scale(.985)}
.trip-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 0 16px}
.trip-top b{display:block;font-size:1.1875rem;font-weight:600;line-height:1.35}
.trip-top span.d{display:block;margin-top:2px;color:var(--muted);font-size:.875rem}
.trip-top .pill{margin-top:2px}
.trip-foot{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 0 18px;border-top:1px solid var(--hair);color:var(--muted);font-size:.875rem}
.trip-foot b{color:var(--ink);font-size:1.0625rem;font-weight:600}

/* 長按旅程卡：浮起＋選單（同貓咪網站的長按） */
.trip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.trip.pressing{transform:scale(.97);transition-duration:.38s}
.trip.held{transform:scale(1.02);box-shadow:0 18px 44px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06);position:relative;z-index:46}
.ctx-scrim{position:fixed;inset:0;z-index:45;background:rgba(245,245,247,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .25s var(--ease)}
.ctx-scrim.on{opacity:1}
.ctx{position:fixed;z-index:47;min-width:230px;padding:6px;border-radius:16px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 12px 40px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.06),inset 0 0 0 .5px rgba(0,0,0,.08);transform-origin:top left;animation:ctxIn .26s var(--spring)}
.ctx.up{transform-origin:bottom left}
.ctx.out{animation:ctxOut .16s var(--ease) forwards}
@keyframes ctxIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes ctxOut{to{opacity:0;transform:scale(.96)}}
.ctx button{display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--ink);font-size:1rem;text-align:left;cursor:pointer;transition:background .15s}
.ctx button:hover,.ctx button:focus-visible{background:var(--soft);outline:none}
.ctx button .ico{color:var(--muted)}
.ctx .sep{height:1px;margin:4px 10px;background:var(--hair)}
.ctx button.danger,.ctx button.danger .ico{color:var(--bad)}
.ctx button.armed{background:var(--bad-soft);font-weight:600}
.trip.renaming{cursor:default}
.trip.renaming input{width:100%;height:40px;margin:-4px 0 0;padding:0 10px;border:1px solid var(--blue);border-radius:10px;background:#fff;font-size:1.0625rem;font-weight:600;color:var(--ink);box-shadow:0 0 0 3px rgba(0,113,227,.15)}
.trip.renaming input:focus{outline:none}
/* 總覽裡的各帳戶剩餘 */
.split{margin-top:16px;border-top:1px solid var(--hair)}
.split button{display:block;width:100%;min-height:46px;padding:0;border:0;border-bottom:1px solid var(--hair);background:transparent;text-align:left;cursor:pointer;transition:opacity .2s}
.split button:last-child{border-bottom:0;margin-bottom:-6px}
.split button:active{opacity:.55}
.split .sp-top{display:flex;align-items:center;gap:12px}
.split .bar{height:5px;margin:8px 0 2px 34px}
.split .ico{color:var(--muted);width:22px}
.split .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split .n small{display:block;color:var(--muted);font-size:.75rem;line-height:1.3}
.split button{padding-block:10px 9px}
.split .v{text-align:right;font-weight:500}
.split .v small{display:block;color:var(--muted);font-size:.75rem;font-weight:400;line-height:1.3}
.split .neg{color:var(--bad)}

/* ===== 統計 ===== */
.st-top{padding:20px 22px}
.st-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.st-row .r{text-align:right}
.st-row .lab{display:block;color:var(--muted);font-size:.8125rem}
.st-row b{display:block;font-size:1.125rem;font-weight:600}
.st-row b.neg{color:var(--bad)}
.st-row .off{display:block;color:var(--muted);font-size:.875rem}
.orb{width:min(220px,62vw);margin:6px auto 4px}
.orb svg{display:block;width:100%;height:auto;filter:drop-shadow(0 14px 28px rgba(0,0,0,.10)) drop-shadow(0 2px 4px rgba(0,0,0,.06))}
.orb .lv{transform:translateY(200px);transition:transform 1.6s cubic-bezier(.22,1,.36,1)}
.orb.fill .lv{transform:translateY(var(--y))}
.orb .wv{animation:wave 5s linear infinite}
.orb .wv.b{fill:rgba(72,72,74,.2);animation-duration:7s;animation-direction:reverse}
.orb .wv.f{fill:rgba(72,72,74,.66)}
.orb.over .wv.f{fill:rgba(184,50,38,.7)}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-120px)}}
.orb .wv.b{animation-name:waveB}
@keyframes waveB{from{transform:translateX(0)}to{transform:translateX(-150px)}}
.orb .pc{font:600 34px var(--font);fill:var(--ink);text-anchor:middle;font-variant-numeric:tabular-nums}
.orb .pl{font:400 12px var(--font);fill:var(--muted);text-anchor:middle;letter-spacing:.1em}
.orb .in{fill:#fff}
.st-body{margin-top:16px;padding:16px 22px 18px}
.mini-wrap{display:flex;justify-content:center;margin-bottom:6px}
.mini-seg{position:relative;display:inline-flex;padding:3px;border-radius:980px;background:rgba(120,120,128,.14);box-shadow:inset 0 1px 2px rgba(0,0,0,.05)}
.mini-seg .thumb{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:980px;pointer-events:none;background:linear-gradient(180deg,#fff,rgba(255,255,255,.88));box-shadow:0 3px 10px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08),inset 0 1px 0 #fff,inset 0 0 0 .5px rgba(0,0,0,.08)}
.mini-seg .thumb.ready{transition:translate .42s var(--ease),width .42s var(--ease)}
.mini-seg button{position:relative;z-index:1;height:30px;min-width:72px;padding:0 14px;border:0;border-radius:980px;background:transparent;color:var(--muted);font-size:.875rem;letter-spacing:.04em;cursor:pointer;transition:color .3s}
.mini-seg button[aria-selected="true"]{color:var(--ink);font-weight:600}
.st-pane.fade-in{animation:fadeIn .35s var(--ease)}
.crow{padding:12px 0 10px;border-bottom:1px solid var(--hair);animation:rise .45s var(--ease) both;animation-delay:calc(var(--i) * 40ms)}
.ctop{display:flex;align-items:center;gap:12px}
.ctop .ico{color:var(--muted);width:22px}
.ctop .cn{flex:1}
.ctop b{font-weight:600}
.ctop .cv{color:var(--muted);font-size:.875rem;min-width:6.5em;text-align:right}
.cbar{height:5px;margin:8px 0 0 34px;border-radius:5px;background:var(--soft);overflow:hidden}
.cbar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#3a3a3c,#1d1d1f);transition:width .9s var(--ease)}
.ctotal{display:flex;justify-content:space-between;padding:14px 0 2px;font-weight:600}
.rank{width:24px;text-align:center;color:var(--muted);font-weight:600}
.trend{display:flex;align-items:flex-end;gap:6px;height:190px;padding-top:10px}
.tcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.tv{font-size:.6875rem;color:var(--muted);white-space:nowrap}
.tb{flex:1;width:100%;max-width:34px;display:flex;align-items:flex-end;border-radius:8px;background:rgba(120,120,128,.08)}
.tb i{display:block;width:100%;height:0;border-radius:8px;background:linear-gradient(180deg,#48484a,#1d1d1f);animation:grow .9s var(--ease) forwards;animation-delay:calc(var(--i) * 50ms)}
@keyframes grow{to{height:var(--h)}}
.td{font-size:.6875rem;color:var(--muted);white-space:nowrap}
.tcol.now .td{color:var(--ink);font-weight:700}
.trend.dense .tv{display:none}
.trend.dense .td{font-size:.5625rem}

/* ===== 換算 ===== */
.cv{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.cv-card{min-width:0;background:#fff;border-radius:18px;padding:12px 20px 14px}
.cv-cur{display:inline-flex;align-items:center;gap:6px;height:32px;margin-left:-8px;padding:0 8px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:.9375rem;cursor:pointer;transition:background .2s}
.cv-cur:active{background:var(--soft)}
.cv-cur b{color:var(--ink);font-weight:600}
.cv-cur .ico{transform:rotate(-90deg);color:var(--faint)}
.cv-row{display:flex;align-items:baseline;gap:10px;margin-top:2px}
.cv-row .sym{flex:none;color:var(--muted);font-size:1.25rem;font-weight:500}
.cv-row input{flex:1;min-width:0;width:0;height:56px;padding:0;border:0;background:transparent;color:var(--ink);font-size:2.375rem;font-weight:600;letter-spacing:-.015em;text-align:right;font-variant-numeric:tabular-nums lining-nums}
.cv-row input:focus{outline:none}
.cv-row input::placeholder{color:var(--line)}
.cv-card.out .cv-row input{color:var(--ink)}
.swap{position:absolute;left:50%;top:50%;z-index:2;display:grid;place-items:center;width:46px;height:46px;margin:-23px 0 0 -23px;border:0;border-radius:50%;color:var(--ink);cursor:pointer;
  background:linear-gradient(180deg,#fff,rgba(255,255,255,.9));box-shadow:0 6px 18px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.1),inset 0 1px 0 #fff,inset 0 0 0 .5px rgba(0,0,0,.08);transition:transform .45s var(--spring)}
.swap:active{transform:scale(.9)}
.swap.spin .ico{animation:spin .45s var(--ease)}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(180deg)}}
.cv-rate{white-space:pre-line;margin:14px 4px 0;text-align:center;color:var(--muted);font-size:.8125rem;line-height:1.7}
.cv-ref{margin-top:16px;padding:6px 22px}
.cv-ref h3{margin:12px 0 4px;font-size:.8125rem;font-weight:500;color:var(--muted)}
.ref{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:46px;padding:0;border:0;border-bottom:1px solid var(--hair);background:transparent;cursor:pointer;font-size:1rem;transition:opacity .2s}
.ref:last-child{border-bottom:0}
.ref:active{opacity:.5}
.ref span:first-child{color:var(--muted)}
.ref b{font-weight:600}

/* 旅程頁分頁：玻璃膠囊（同貓咪網站） */
.seg-nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:center;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:rgba(245,245,247,.82);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);transition:box-shadow .3s}
.seg-nav.stuck{box-shadow:0 1px 0 rgba(0,0,0,.06)}
.seg-nav .cap{position:relative;display:inline-flex;padding:4px;border-radius:980px;background:rgba(120,120,128,.16);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:background .25s}
.seg-nav .thumb{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:980px;pointer-events:none;background:linear-gradient(180deg,#fff,rgba(255,255,255,.88));box-shadow:0 4px 14px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.10),inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.04),inset 0 0 0 .5px rgba(0,0,0,.08)}
.seg-nav .thumb.ready{transition:translate .45s var(--ease),width .45s var(--ease),scale .3s var(--ease),box-shadow .3s var(--ease)}
/* 按住滑塊左右拖：滑塊微微放大、陰影加深，放開切到那一格（同貓咪網站） */
.seg-nav .cap.drag{background:rgba(120,120,128,.2)}
.seg-nav .cap.drag .thumb{transition:scale .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s var(--ease);scale:1.08;box-shadow:0 10px 26px rgba(0,0,0,.20),0 3px 8px rgba(0,0,0,.10),inset 0 1px 0 #fff,inset 0 0 0 .5px rgba(0,0,0,.08)}
.seg-nav .cap.drag button[aria-selected="true"]:not(.over){color:var(--muted);font-weight:400}
.seg-nav .cap button.over{color:var(--ink);font-weight:600}
body.dragging,body.dragging *{cursor:grabbing !important}
.seg-nav button{position:relative;z-index:1;height:36px;min-width:72px;padding:0 16px;border:0;border-radius:980px;background:transparent;color:var(--muted);font-size:.9375rem;letter-spacing:.04em;cursor:pointer;transition:color .3s}
.seg-nav button[aria-selected="true"]{color:var(--ink);font-weight:600}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}

/* 總覽 */
.sum{padding:22px 22px 20px}
.sum .lab{color:var(--muted);font-size:.875rem}
.sum .big{margin-top:2px;font-size:2.5rem;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.sum .big small{font-size:1.0625rem;font-weight:500;color:var(--muted);margin-right:6px;letter-spacing:0}
.sum .big.neg{color:var(--bad)}
.bar{height:6px;border-radius:6px;background:var(--soft);overflow:hidden;margin:16px 0 12px}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:var(--blue);transition:width .8s var(--ease)}
.bar.warn i{background:#d08a1e}.bar.over i{background:var(--bad)}
.kv{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.875rem}
.kv b{color:var(--ink);font-weight:500;margin-left:6px}

/* 每日記帳 */
.day-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 0 10px;border-bottom:1px solid var(--line)}
.day-h b{font-size:1.0625rem;font-weight:600}
.day-h em{font-style:normal;color:var(--muted);font-size:.875rem;margin-left:8px}
.day-h span.t{color:var(--muted);font-size:.875rem}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:66px;padding:10px 0;border:0;border-bottom:1px solid var(--hair);background:transparent;text-align:left;cursor:pointer;transition:background .2s,opacity .2s}
.row.last{border-bottom:0}
.row:active{opacity:.55}
.row > .ico{color:var(--muted);width:24px}
.row .mid{flex:1;min-width:0}
.row .t{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{display:block;color:var(--muted);font-size:.8125rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{flex:none;text-align:right}
.row .amt b{display:block;font-weight:500;font-size:1rem}
.row .amt span{display:block;color:var(--muted);font-size:.8125rem}
.row.off .t,.row.off .amt b{color:var(--faint)}
.row.fresh{animation:fresh 1.4s var(--ease)}
@keyframes fresh{0%{background:var(--blue-soft)}100%{background:transparent}}
.empty{padding:40px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.0625rem;font-weight:600;margin-bottom:4px}

/* 預算帳戶 */
.acct{display:block;width:100%;padding:18px 0;border:0;border-bottom:1px solid var(--hair);background:transparent;text-align:left;cursor:pointer;transition:opacity .2s}
.acct:active{opacity:.55}
.acct-top{display:flex;align-items:center;gap:14px}
.acct-top > .ico{color:var(--muted);width:24px}
.acct-top .mid{flex:1;min-width:0}
.acct-top .mid b{display:block;font-weight:600}
.acct-top .mid span{display:block;color:var(--muted);font-size:.8125rem}
.acct-top .left{text-align:right}
.acct-top .left b{display:block;font-size:1.125rem;font-weight:600}
.acct-top .left span{display:block;color:var(--muted);font-size:.8125rem}
.acct .bar{margin:12px 0 8px 38px}
.acct .kv{margin-left:38px;font-size:.8125rem}

/* 記一筆：底部置中的藍色膠囊 */
.fab{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:25;display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px 0 22px;border:0;border-radius:980px;background:var(--blue);color:#fff;font-size:1.0625rem;font-weight:500;letter-spacing:.04em;cursor:pointer;transform:translateX(-50%);box-shadow:0 10px 28px rgba(0,113,227,.32),0 2px 6px rgba(0,0,0,.08);transition:transform .4s var(--spring);animation:fabIn .6s .2s var(--spring) both}
@keyframes fabIn{from{opacity:0;transform:translate(-50%,24px)}to{opacity:1;transform:translateX(-50%)}}
.fab:active{transform:translateX(-50%) scale(.94)}

/* ===== 底部面板（iOS 式：取消／標題／完成） ===== */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.28);opacity:0;transition:opacity .35s var(--ease)}
.scrim.on{opacity:1}
.sheet{position:fixed;left:50%;bottom:0;z-index:41;width:min(100%,var(--col));max-height:calc(100vh - 28px - env(safe-area-inset-top,0px));overflow:auto;overscroll-behavior:contain;transform:translate(-50%,104%);background:var(--band);border-radius:16px 16px 0 0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transition:transform .5s cubic-bezier(.22,1,.36,1)}
.sheet.on{transform:translate(-50%,0)}
.sheet-h{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:56px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px));background:rgba(245,245,247,.86);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.sheet-h h2{margin:0;font-size:1.0625rem;font-weight:600}
.sheet-h button{justify-self:start;height:44px;padding:0;border:0;background:transparent;color:var(--link);font-size:1.0625rem;cursor:pointer;transition:opacity .2s}
.sheet-h button.done{justify-self:end;font-weight:600}
.sheet-h button:disabled{color:var(--faint);cursor:default}
.sheet-h button:active{opacity:.5}
.grp{background:#fff;border-radius:14px;margin-top:22px;overflow:hidden}
.grp-lab{margin:24px 16px -14px;color:var(--muted);font-size:.8125rem}
.line{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border-top:1px solid var(--hair)}
.line:first-child{border-top:0}
.line > label,.line > .k{flex:none;width:5em;color:var(--ink)}
.line input,.line select{flex:1;min-width:0;height:50px;padding:0;border:0;border-radius:0;background:transparent;font-size:1rem;color:var(--ink);text-align:right;-webkit-appearance:none;appearance:none}
.line input::placeholder{color:var(--faint)}
.line input:focus,.line select:focus{outline:none}
/* 日期時間：自己排版顯示的文字，原生選擇器透明蓋在上面（各家瀏覽器的日期欄位寬度不一，直接顯示會凸出去） */
.pick{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;height:50px}
.pick span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.line .pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.pick:focus-within span{color:var(--link)}
/* 自己做的日曆與時間滾輪：點日期列就在下面展開 */
.line.go .val.on{color:var(--ink);font-weight:600}
.line.go:focus-visible{outline:none;background:var(--soft)}
.expand{display:grid;grid-template-rows:0fr;transition:grid-template-rows .42s var(--ease)}
.expand.open{grid-template-rows:1fr}
.expand > div{min-height:0;overflow:hidden}
/* 滾輪選擇器（像 iPhone 鬧鐘）：中間灰色玻璃選取帶，上下的項目沿著圓柱彎下去、漸淡 */
.pk{border-top:1px solid var(--hair);padding-top:6px}
.wheels{position:relative;display:flex;justify-content:center;align-items:center;height:216px;margin:0 12px}
.wheels::before{content:"";position:absolute;left:0;right:0;top:50%;height:38px;transform:translateY(-50%);border-radius:11px;background:rgba(120,120,128,.13);pointer-events:none}
.wheel{position:relative;flex:none;height:216px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;perspective:420px;-webkit-user-select:none;user-select:none;
  -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel:focus{outline:none}
.wheel .pad{height:90px}
.wheel .it{height:36px;line-height:36px;text-align:center;font-size:1.3125rem;white-space:nowrap;scroll-snap-align:center;transform-origin:50% 50%;will-change:transform,opacity;cursor:pointer;font-variant-numeric:tabular-nums lining-nums}
.wheel .it.off{color:var(--faint)}
.wheels .colon{position:relative;font-size:1.25rem;font-weight:600;padding:0 2px}
.cal-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px 14px}
.cal-foot .hint{font-size:.8125rem}
.cal-ok{height:36px;padding:0 22px;border:0;border-radius:980px;color:var(--ink);font-size:.9375rem;font-weight:600;letter-spacing:.06em;cursor:pointer;background:linear-gradient(180deg,#fff,rgba(255,255,255,.88));box-shadow:0 4px 14px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.08),inset 0 1px 0 #fff,inset 0 0 0 .5px rgba(0,0,0,.1);transition:transform .25s var(--spring),box-shadow .25s}
.cal-ok:active{transform:scale(.94);box-shadow:0 2px 6px rgba(0,0,0,.1),inset 0 0 0 .5px rgba(0,0,0,.1)}
/* 預算帳戶列：可以自己新增 */
.brow{gap:10px}
.line .bname{flex:none;width:6.5em;text-align:left}
.line .bamt{flex:1}
.unit-btn{flex:none;min-width:48px;height:28px;padding:0 10px;border:0;border-radius:980px;background:var(--soft);color:var(--muted);font-size:.8125rem;letter-spacing:.04em;cursor:pointer;transition:background .2s,color .2s,transform .2s var(--ease)}
.unit-btn:active{transform:scale(.92)}
.rm{flex:none;display:grid;place-items:center;width:22px;height:22px;padding:0;border:0;border-radius:50%;background:var(--bad);color:#fff;cursor:pointer;transition:transform .2s var(--ease)}
.rm:active{transform:scale(.85)}
.rm::before{content:"";width:10px;height:2px;border-radius:2px;background:currentColor}
.brow.out{animation:rowOut .3s var(--ease) forwards;overflow:hidden}
@keyframes rowOut{to{opacity:0;min-height:0;height:0;padding-block:0;border-top-width:0}}
.brow.in{animation:rowIn .35s var(--ease)}
@keyframes rowIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.add-row .link-btn{height:52px}
.line select{text-align-last:right}
.line .unit{color:var(--muted);flex:none;font-size:.9375rem}
.line.stack-line{display:grid;gap:12px;padding:14px 16px}
.line .toggle-lab{flex:1;width:auto}

/* 金額 */
.amount-box{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;gap:6px;padding:18px 0 4px}
.cur-seg{display:inline-flex;padding:3px;border-radius:980px;background:rgba(120,120,128,.12)}
.cur-seg button{min-width:64px;height:30px;padding:0 14px;border:0;border-radius:980px;background:transparent;color:var(--muted);font-size:.875rem;letter-spacing:.06em;cursor:pointer;transition:background .25s,color .25s,box-shadow .25s}
.cur-seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.04)}
/* 金額：自己排版「符號＋數字＋游標」，真正的輸入框透明蓋在上面（各瀏覽器的輸入框游標位置不一致） */
.amount{position:relative;min-width:0;max-width:100%;overflow:hidden;display:flex;align-items:baseline;justify-content:center;width:100%;margin-top:10px;--fs:3.25rem;cursor:text}
.amount .sym{font-size:calc(var(--fs) * .5);font-weight:500;color:var(--muted);margin-right:.32em;white-space:nowrap;line-height:1}
.amount .shown{font-size:var(--fs);font-weight:600;letter-spacing:-.015em;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums lining-nums}
.amount .shown.ghost{color:var(--line)}
.amount .caret{align-self:center;width:2.5px;height:calc(var(--fs) * .82);margin-left:3px;border-radius:2px;background:var(--ink);opacity:0}
.amount.focus .caret{animation:blink 1.06s steps(1) infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.amount input{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;opacity:0;font-size:16px;color:transparent;background:transparent;caret-color:transparent;cursor:text}
.conv{color:var(--muted);font-size:.875rem;min-height:1.4em}

/* 類別：一排圓形圖示 */
.cats{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:22px}
.cat{display:grid;justify-items:center;gap:6px;padding:0;border:0;background:transparent;color:var(--muted);font-size:.75rem;cursor:pointer}
.cat .ico{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--ink);transition:background .25s,color .25s,transform .35s var(--spring)}
.cat[aria-pressed="true"]{color:var(--ink);font-weight:600}
.cat[aria-pressed="true"] .ico{background:var(--ink);color:#fff;transform:scale(1.06)}
.cat:active .ico{transform:scale(.9)}
.cats.four{grid-template-columns:repeat(4,minmax(0,1fr))}

/* 付款方式：膠囊 */
.pays{display:flex;flex-wrap:wrap;gap:8px}
.pay{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:980px;background:#fff;color:var(--ink);font-size:.875rem;cursor:pointer;transition:background .25s,color .25s,border-color .25s,transform .2s var(--ease)}
.pay:active{transform:scale(.95)}
.pay[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

.line input.switch,.switch{position:relative;width:51px;height:31px;flex:none;margin:0;appearance:none;-webkit-appearance:none;border-radius:31px;background:#e9e9ea;cursor:pointer;transition:background .25s}
.line input.switch::after,.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.08);transition:transform .32s var(--spring)}
.line input.switch:checked,.switch:checked{background:var(--blue)}
.line input.switch:checked::after,.switch:checked::after{transform:translateX(20px)}
.hint{display:block;color:var(--muted);font-size:.75rem;line-height:1.4}
.del{display:block;width:100%;height:52px;border:0;background:transparent;color:var(--bad);font-size:1rem;cursor:pointer;transition:background .2s}
.del.armed{background:var(--bad-soft);font-weight:600}
.err{margin:10px 16px 0;color:var(--bad);font-size:.8125rem;min-height:1.3em}

/* 帳號 */
.me{display:flex;align-items:center;gap:14px;padding:16px}
.me .me-btn{width:48px;height:48px;font-size:1.125rem;cursor:default}
.me b{display:block;font-weight:600}
.me span.e{color:var(--muted);font-size:.875rem}
.menu-btn{display:block;width:100%;height:52px;padding:0 16px;border:0;border-top:1px solid var(--hair);background:transparent;text-align:left;font-size:1rem;color:var(--link);cursor:pointer}
.menu-btn.red{color:var(--bad)}
.menu-btn:active{background:var(--soft)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;padding:10px 20px;border-radius:980px;background:rgba(29,29,31,.92);color:#fff;font-size:.9375rem;transform:translate(-50%,8px);opacity:0;transition:opacity .25s,transform .35s var(--spring);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:360px){.card,.trip{padding-left:18px;padding-right:18px}.sum{padding:20px 18px}.sum .big{font-size:2.125rem}.amount{--fs:2.75rem}.cat .ico{width:38px;height:38px}.seg-nav button{min-width:64px;padding:0 14px}.line > label,.line > .k{width:4em}.line input,.line select{font-size:.9375rem}.line .bname{width:5em}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>

const BAKED = Object.fromEntries(Object.entries(CUR).map(([k, v]) => [k, v.rate]));
const RATES = {date:"2026-10-24", live:false};
const RATE_KEY = "travelHelper.rates";
function applyRates(map, date, live){
  let n = 0;
  for(const [k, v] of Object.entries(map)){
    // 安全檢查：只接受合理的正數，而且跟內建值差不到 3 倍（防止來源被竄改或資料錯誤）
    if(!CUR[k] || k === "TWD" || typeof v !== "number" || !isFinite(v) || v <= 0) continue;
    if(v > BAKED[k] * 3 || v < BAKED[k] / 3) continue;
    CUR[k].rate = v; n++;
  }
  if(n){ RATES.date = date; RATES.live = !!live; }
  return n;
}
try{ const c = JSON.parse(localStorage.getItem(RATE_KEY)); if(c && c.date > RATES.date) applyRates(c.map, c.date, true); }catch(e){}
async function refreshRates(){
  if(RATES.live && RATES.date >= ymd(new Date(Date.now() - 864e5))) return;      // 已經是今天或昨天的就不再抓
  const urls = ["https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/twd.min.json",
                "https://latest.currency-api.pages.dev/v1/currencies/twd.min.json"];
  for(const u of urls){
    try{
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 6000);
      const res = await fetch(u, {signal:ctl.signal, cache:"no-cache"}); clearTimeout(tm);
      if(!res.ok) continue;
      const j = await res.json();
      if(!j || typeof j.date !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(j.date) || !j.twd) continue;
      const map = {};
      for(const k of Object.keys(CUR)){ const v = j.twd[k.toLowerCase()]; if(typeof v === "number" && v > 0) map[k] = 1 / v; }   // 來源是「1 台幣 = 多少外幣」，換成「1 外幣 = 多少台幣」
      if(applyRates(map, j.date, true)){
        try{ localStorage.setItem(RATE_KEY, JSON.stringify({date:j.date, map})); }catch(e){}
        if(!sheetOpen && !subPage) render();
        return;
      }
    }catch(e){}
  }
}

function fmt(minor, c){
  const d = CUR[c].dec, v = minor / unit(c);
  const s = Math.abs(v).toLocaleString("zh-TW", {minimumFractionDigits:d, maximumFractionDigits:d});
  return (v < 0 ? "−" : "") + CUR[c].sym + (CUR[c].sym.length > 1 ? " " : "") + s;
}

/* ================= 日期 ================= */
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dayDiff = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const WEEK = "日一二三四五六";
const md = s => { const d = parseYmd(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const mdw = s => `${md(s)}（${WEEK[parseYmd(s).getDay()]}）`;
const range = t => {
  const a = parseYmd(t.start), b = parseYmd(t.end), now = new Date().getFullYear();
  return `${a.getFullYear() !== now ? a.getFullYear() + "/" : ""}${md(t.start)} – ${a.getFullYear() !== b.getFullYear() ? b.getFullYear() + "/" : ""}${md(t.end)}`;
};
function phase(t){
  const today = ymd(new Date());
  if(today < t.start) return {key:"before", label:`還有 ${dayDiff(today, t.start)} 天`};
  if(today > t.end) return {key:"after", label:"已結束"};
  return {key:"during", label:`第 ${dayDiff(t.start, today) + 1} 天`};
}

/* ================= 計算 ================= */
function acctSpent(t, a){        // 用帳戶自己的幣別計算已花（不含「不計入」）
  return t.expenses.filter(e => e.acct === a.id && !e.excluded).reduce((sum, e) =>
    sum + (e.cur === a.cur ? e.amount : Math.round(twdOf(e) / CUR[a.cur].rate * unit(a.cur))), 0);
}
function totals(t){
  const budget = t.accounts.reduce((s, a) => s + Math.round(a.budget / unit(a.cur) * CUR[a.cur].rate), 0);
  const spent = t.expenses.filter(e => !e.excluded).reduce((s, e) => s + twdOf(e), 0);
  return {budget, spent, left:budget - spent};
}
function barEl(spent, budget){
  const p = budget > 0 ? spent / budget : (spent > 0 ? 1 : 0);
  const b = el("div", {class:"bar" + (p > 1 ? " over" : p >= .9 ? " warn" : ""), role:"progressbar", "aria-label":"已用預算", "aria-valuemin":"0", "aria-valuemax":"100", "aria-valuenow":String(Math.min(100, Math.round(p * 100)))}, el("i"));
  requestAnimationFrame(() => requestAnimationFrame(() => { b.firstChild.style.width = Math.min(100, p * 100) + "%"; }));
  return b;
}

function wheel(items, value, onChange, width){

  if(e) title.value = e.title;
  const cats = el("div", {class:"cats", role:"group", "aria-label":"類別"}, CATS.map(c => {
    const b = el("button", {type:"button", class:"cat", "aria-pressed":String(st.cat === c.id), onclick:() => { st.cat = c.id; title.placeholder = c.name; cats.querySelectorAll(".cat").forEach(x => x.setAttribute("aria-pressed", String(x === b))); }}, icon(c.icon, 20), el("span", {text:c.name}));
    return b;
  }));
  const pays = el("div", {class:"pays", role:"group", "aria-label":"付款方式"}, t.accounts.map(a => {
    const b = el("button", {type:"button", class:"pay", "aria-pressed":String(st.acct === a.id), text:a.name, onclick:() => { st.acct = a.id; pays.querySelectorAll(".pay").forEach(x => x.setAttribute("aria-pressed", String(x === b))); }});
    return b;
  }));
  const d0 = e ? new Date(e.time) : new Date();
  const dt = dateTime(d0), when = dt.input;
  const excl = el("input", {type:"checkbox", class:"switch", id:"f-excl", checked:e ? e.excluded : false});
  const body = el("div", null,
    el("div", {class:"amount-box"}, seg, el("div", {class:"amount"}, sym, shown, caret, amt), conv),
    cats,
    el("div", {class:"grp"},
      el("div", {class:"line stack-line"}, el("span", {class:"k", text:"付款方式"}), t.accounts.length ? pays : el("span", {class:"hint", text:"還沒有預算帳戶，先到「預算」新增"})),
      line("名稱", title), dt.row, dt.panel,
      el("div", {class:"line"}, el("label", {for:"f-excl", class:"toggle-lab"}, "不計入統計", el("span", {class:"hint", text:"出發前付的機票等，不扣旅途預算"})), excl)));
  let del = null;
  if(editing){ del = el("button", {type:"button", class:"del", text:"刪除這筆"}); body.append(el("div", {class:"grp"}, del)); }
  const {close, ok} = openSheet({title:editing ? "編輯" : "記一筆", done:editing ? "儲存" : "記下", body, onDone:save});
  function update(){
    cleanAmount(amt, st.cur);
    const m = parseAmount(amt.value, st.cur);
    sym.textContent = CUR[st.cur].sym;
    conv.textContent = st.cur === "TWD" ? "新台幣" : m ? "約 " + fmt(Math.round(m / unit(st.cur) * CUR[st.cur].rate), "TWD") : CUR[st.cur].name;
    ok.disabled = !m;
    shown.textContent = amt.value || "0"; shown.classList.toggle("ghost", !amt.value);
    fitAmount();
  }
  amt.addEventListener("input", update);
  const box = () => amt.parentNode;
  amt.addEventListener("focus", () => box().classList.add("focus")); amt.addEventListener("blur", () => box().classList.remove("focus"));
  // 數字太長時整組縮小，永遠放得進一行
  function fitAmount(){
    const b = box(); if(!b) return;
    b.style.removeProperty("--fs");
    const avail = b.parentNode.clientWidth - 8;   // 用外框寬度量，不受數字本身撐開影響
    const need = () => sym.offsetWidth + shown.offsetWidth + caret.offsetWidth + 16;
    let fs = parseFloat(getComputedStyle(b).getPropertyValue("--fs")) || 3.25;
    for(let i = 0; i < 14 && need() > avail && fs > 1.5; i++){ fs = Math.max(1.5, fs * .9); b.style.setProperty("--fs", fs + "rem"); }
  }
  amt.addEventListener("keydown", ev => { if(ev.key === "Enter" && !ok.disabled){ ev.preventDefault(); save(); } });
  update();
  if(document.fonts) document.fonts.ready.then(update);
  if(!editing) setTimeout(() => amt.focus({preventScroll:true}), 420);
  function save(){
    const m = parseAmount(amt.value, st.cur); if(!m) return;
    const tm = when.value ? new Date(when.value) : new Date();
    const rec = {title:title.value.trim().slice(0, 40), amount:m, cur:st.cur, acct:st.acct || null, cat:st.cat, time:isNaN(tm) ? new Date().toISOString() : tm.toISOString(), excluded:excl.checked};
    if(editing){
      if(rec.cur !== e.cur || rec.amount !== e.amount) rec.rate = CUR[rec.cur].rate;   // 金額或幣別有改才用現在的匯率
      Object.assign(e, rec); S.fresh = e.id;
    } else { const n = {id:uid("e"), rate:CUR[rec.cur].rate, ...rec}; t.expenses.push(n); S.fresh = n.id; }
    Store.data.lastPick = {cat:st.cat, acct:st.acct};
    Store.save(); close(); render(); S.fresh = null; toast(editing ? "已儲存" : "已記下");
  }
  if(del) twoStep(del, "刪除這筆", () => { t.expenses = t.expenses.filter(x => x.id !== e.id); Store.save(); close(); render(); toast("已刪除"); });
}

/* ---------- 新增／編輯旅程 ---------- */
function openTripForm(trip){
  const editing = !!trip, today = new Date();
  const st = {country:editing ? (trip.country || CUR[trip.cur].name) : "日本", cur:editing ? trip.cur : "JPY"};
  const name = el("input", {id:"t-name", maxLength:24, placeholder:"東京自由行", autocomplete:"off", value:editing ? trip.name : ""});
  const dest = el("input", {id:"t-dest", maxLength:12, placeholder:"東京", autocomplete:"off", value:editing ? (trip.dest || "") : ""});
  const dr = dateRange(editing ? trip.start : ymd(addDays(today, 30)), editing ? trip.end : ymd(addDays(today, 34)));
  const start = dr.start, end = dr.end;
  // 已經有記帳的旅程不能換貨幣（換了金額就對不上）
  const locked = editing && trip.expenses.length > 0;
  const curVal = el("span", {class:"val", text:`${st.country} ${st.cur}`});
  const curBtn = el("button", {type:"button", class:"line go", disabled:locked, onclick:() => pickCountry(editing ? "編輯旅程" : "新增旅程", st, c => {
    st.country = c.name; st.cur = c.cur; curVal.textContent = `${c.name} ${c.cur}`;
    if(!dest.value) dest.placeholder = c.name;
    rows.forEach(r => { r.ub.textContent = r.cur(); cleanAmount(r.amt, r.cur()); });
  })}, el("span", {class:"k", text:"當地貨幣"}), curVal, locked ? null : icon("back", 16, 2));
  if(!locked){ const ch = curBtn.querySelector(".ico"); if(ch) ch.classList.add("chev"); }
  // 預算帳戶：新增和編輯旅程都在這裡設定（不用另外的預算分頁）
  const rowsBox = el("div"), rows = [];
  let n = 0;
  const addRow = (nm, method, local, focus, acct) => {
    const r = {method, local, id:"b" + (++n), acctId:acct ? acct.id : null};
    r.name = el("input", {id:`t-bn-${r.id}`, class:"bname", maxLength:16, value:nm, placeholder:"名稱", autocomplete:"off", "aria-label":"帳戶名稱"});
    r.amt = el("input", {id:`t-ba-${r.id}`, class:"bamt", inputmode:"decimal", placeholder:"0", autocomplete:"off", "aria-label":"預算金額"});
    r.cur = () => r.local ? st.cur : "TWD";
    r.ub = el("button", {type:"button", class:"unit-btn", "aria-label":"切換幣別", text:r.cur(), onclick:() => { r.local = !r.local; r.ub.textContent = r.cur(); cleanAmount(r.amt, r.cur()); }});
    if(acct && acct.budget) r.amt.value = plain(acct.budget, acct.cur);
    r.amt.addEventListener("input", () => cleanAmount(r.amt, r.cur()));
    const rm = el("button", {type:"button", class:"rm", "aria-label":"移除這個帳戶", onclick:() => {
      rows.splice(rows.indexOf(r), 1); r.el.style.height = r.el.offsetHeight + "px"; r.el.classList.add("out"); setTimeout(() => r.el.remove(), 300);
    }});
    r.el = el("div", {class:"line brow" + (focus ? " in" : "")}, rm, r.name, r.amt, r.ub);
    rows.push(r); rowsBox.append(r.el);
    if(focus) setTimeout(() => r.name.focus(), 50);
  };
  const err = el("p", {class:"err", role:"alert"});
  const body = el("div", null,
    el("div", {class:"grp"}, line("名稱", name), line("目的地", dest)),
    el("div", {class:"grp"}, ...dr.rows, curBtn));
  if(locked) body.append(el("p", {class:"hint", style:"margin:8px 16px 0", text:"已經有記帳，當地貨幣不能更改"}));
  if(editing) trip.accounts.forEach(a => addRow(a.name, a.method, a.cur !== "TWD", false, a));
  else { addRow("現金", "cash", true); addRow("信用卡", "card", false); }
  body.append(el("p", {class:"grp-lab", text:"預算（每種付款方式各帶多少）"}),
    el("div", {class:"grp"}, rowsBox, el("div", {class:"line add-row"}, el("button", {type:"button", class:"link-btn", onclick:() => addRow("", "epay", true, true)}, icon("plus", 18, 1.8), el("span", {text:"新增付款方式"})))));
  body.append(err);
  let del = null;
  if(editing){ del = el("button", {type:"button", class:"del", text:"刪除旅程"}); body.append(el("div", {class:"grp"}, del), el("p", {class:"hint", style:"margin:8px 16px 0", text:"刪除後，這趟旅程的記帳和預算帳戶會一起刪除"})); }
  const {close} = openSheet({title:editing ? "編輯旅程" : "新增旅程", done:editing ? "儲存" : "建立", body, onDone:() => {
    if(!name.value.trim()){ err.textContent = "請填旅程名稱"; name.focus(); return; }
    if(!start.value || !end.value){ err.textContent = "請選出發和回程日期"; return; }
    if(end.value < start.value){ err.textContent = "回程日要在出發日之後"; return; }
    const info = {name:name.value.trim().slice(0, 24), dest:dest.value.trim().slice(0, 12), start:start.value, end:end.value, country:st.country, cur:st.cur};
    if(editing){
      const keep = new Set();
      trip.accounts = rows.filter(r => r.acctId || r.name.value.trim() || r.amt.value).map(r => {
        const old = r.acctId && trip.accounts.find(a => a.id === r.acctId);
        if(old) keep.add(old.id);
        return {id:old ? old.id : uid("a"), name:(r.name.value.trim() || METHODS[r.method].name).slice(0, 16), method:r.method, cur:r.cur(), budget:parseAmount(r.amt.value, r.cur()) || 0};
      });
      trip.expenses.forEach(x => { if(x.acct && !keep.has(x.acct) && !trip.accounts.some(a => a.id === x.acct)) x.acct = null; });   // 刪掉的付款方式：記帳保留，變成「未指定」
      Object.assign(trip, info); delete trip.sample;
      Store.save(); close(); render(); toast("已儲存");
      return;
    }
    const accounts = rows.filter(r => r.name.value.trim() || r.amt.value).map(r => ({
      id:uid("a"), name:(r.name.value.trim() || METHODS[r.method].name).slice(0, 16), method:r.method, cur:r.cur(), budget:parseAmount(r.amt.value, r.cur()) || 0}));
    const t = {id:uid("t"), ...info, accounts, expenses:[]};
    Store.data.trips.push(t); Store.save(); close(); go("trip", {tripId:t.id, tab:"ledger"}); toast("旅程已建立");
  }});
  if(del) twoStep(del, "刪除旅程", () => {
    Store.data.trips = Store.data.trips.filter(x => x.id !== trip.id);
    Store.save(); close(); go("home"); toast("已刪除旅程");
  });
  if(!editing) setTimeout(() => name.focus({preventScroll:true}), 420);
}

/* ---------- 預算帳戶 ---------- */
function openAccountForm(t, a){
  const editing = !!a;
  const st = {method:a ? a.method : "cash", cur:a ? a.cur : t.cur};
  const name = el("input", {id:"a-name", maxLength:16, placeholder:METHODS[st.method].name, autocomplete:"off"});
  if(a) name.value = a.name;
  const methods = el("div", {class:"cats four", role:"group", "aria-label":"付款方式", style:"margin-top:18px"}, Object.entries(METHODS).map(([k, m]) => {
    const b = el("button", {type:"button", class:"cat", "aria-pressed":String(st.method === k), onclick:() => { st.method = k; name.placeholder = m.name; methods.querySelectorAll(".cat").forEach(x => x.setAttribute("aria-pressed", String(x === b))); }}, icon(m.icon, 20), el("span", {text:m.name}));
    return b;
  }));
  const amt = el("input", {id:"a-amt", inputmode:"decimal", placeholder:"0", autocomplete:"off"});
  if(a) amt.value = plain(a.budget, a.cur);
  const u = el("span", {class:"unit", text:st.cur});
  const curSel = el("select", {id:"a-cur"}, [...new Set([t.cur, "TWD"])].map(c => el("option", {value:c, text:`${CUR[c].name} ${c}`, selected:st.cur === c})));
  curSel.addEventListener("change", () => { st.cur = curSel.value; u.textContent = st.cur; cleanAmount(amt, st.cur); });
  amt.addEventListener("input", () => cleanAmount(amt, st.cur));
  const err = el("p", {class:"err", role:"alert"});
  const body = el("div", null, methods, el("div", {class:"grp"}, line("名稱", name), line("幣別", curSel), line("預算", amt, u)), err);
  let del = null;
  if(editing){ del = el("button", {type:"button", class:"del", text:"刪除這個帳戶"}); body.append(el("div", {class:"grp", style:"margin-top:8px"}, del)); }
  const {close} = openSheet({title:editing ? "預算帳戶" : "新增預算帳戶", done:editing ? "儲存" : "新增", body, onDone:() => {
    const nm = (name.value.trim() || METHODS[st.method].name).slice(0, 16);
    const b = amt.value ? parseAmount(amt.value, st.cur) : 0;
    if(b === null){ err.textContent = "預算金額格式不對"; return; }
    if(editing) Object.assign(a, {name:nm, method:st.method, cur:st.cur, budget:b});
    else t.accounts.push({id:uid("a"), name:nm, method:st.method, cur:st.cur, budget:b});
    Store.save(); close(); render(); toast(editing ? "已儲存" : "已新增");
  }});
  if(del) twoStep(del, "刪除這個帳戶", () => {
    t.accounts = t.accounts.filter(x => x.id !== a.id);
    t.expenses.forEach(x => { if(x.acct === a.id) x.acct = null; });   // 記帳保留，付款方式變成「未指定」
    Store.save(); close(); render(); toast("已刪除");
  });
}

/* ---------- 帳號 ---------- */
function openMe(){
  const u = Store.data.user;
  const reset = el("button", {type:"button", class:"menu-btn", text:"重設範例資料"});
  const out = el("button", {type:"button", class:"menu-btn red", text:"登出"});
  const body = el("div", null, el("div", {class:"grp"},
    el("div", {class:"me"}, el("span", {class:"me-btn", text:u.name.slice(0, 1)}), el("div", null, el("b", {text:u.name}), el("span", {class:"e", text:u.email}))),
    reset, out));
  const {close} = openSheet({title:"帳號", done:"完成", body, onDone:() => close()});
  reset.addEventListener("click", () => { Store.data.trips = sampleTrips(); Store.save(); close(); go("home"); toast("範例資料已重設"); });
  out.addEventListener("click", () => { Store.data.user = null; Store.save(); close(); go("home"); });
}

Store.load();
render();
refreshRates();
